# cspell:words vllm
# Kubernetes service account of the vLLM pod. The model-download
# initContainer uses it to read the checkpoint from Cloud Storage through fleet
# Workload Identity Federation. Grant the Google service account below
# roles/storage.objectViewer on the bucket and roles/iam.workloadIdentityUser to
# serviceAccount:YOUR_PROJECT_ID.svc.id.goog[sft-model-serving/vllm-llama-sft-sa].
# The annotation documents the mapping; the token exchange itself is configured
# in gcs-credential-config.yaml.
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  name: vllm-llama-sft-sa
  namespace: sft-model-serving
  labels:
    app: vllm-llama-sft
  annotations:
    iam.gke.io/gcp-service-account: YOUR_GSA_NAME@YOUR_PROJECT_ID.iam.gserviceaccount.com
