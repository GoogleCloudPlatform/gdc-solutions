apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - gradio-llama-sft-deployment.yaml
  - gradio-llama-sft-service.yaml
  - namespace.yaml
  - sft-model-cache-pvc.yaml
  - vllm-llama-sft-config.yaml
  - vllm-llama-sft-deployment.yaml
  - vllm-llama-sft-podmonitoring.yaml
  - vllm-llama-sft-service.yaml
  - vllm-llama-sft-serviceaccount.yaml
# Single source of truth for the model release. Kustomize appends a content
# hash to the ConfigMap name, so changing a value rolls out a new pod.
configMapGenerator:
  - name: vllm-llama-sft-release
    literals:
      - MODEL_GCS_URI=gs://YOUR_BUCKET/sft-model-serving/checkpoints/v1
      - MODEL_VERSION=v1
      - RELEASE_TAG=v1.0.0
