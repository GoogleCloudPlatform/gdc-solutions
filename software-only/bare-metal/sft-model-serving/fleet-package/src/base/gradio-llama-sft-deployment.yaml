# cspell:words gradio vllm
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gradio-llama-sft-deployment
  namespace: sft-model-serving
  labels:
    app: gradio-llama-sft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gradio-llama-sft
  template:
    metadata:
      labels:
        app: gradio-llama-sft
    spec:
      containers:
        - name: gradio
          image: us-docker.pkg.dev/google-samples/containers/gke/gradio-app:v1.0.4
          imagePullPolicy: IfNotPresent
          env:
            - name: CONTEXT_PATH
              value: /v1/chat/completions
            - name: HOST
              value: http://vllm-llama-sft-service:8000
            - name: MODEL_ID
              value: llama-3.1-8b-sft-v1.0.0
            - name: TITLE
              value: Llama 3.1 8B SFT Chat (v1.0.0)
            - name: MODEL_NAME
              value: Llama-3.1-8B-SFT-v1.0.0
          ports:
            - containerPort: 7860
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
