              if [ -f "${TARGET_DIR}/config.json" ] && [ -f "${TARGET_DIR}/tokenizer.json" ] && [ -f "${TARGET_DIR}/model.safetensors.index.json" ]; then
                echo "Model version '${MODEL_VERSION}' is already cached. Skipping the download."
