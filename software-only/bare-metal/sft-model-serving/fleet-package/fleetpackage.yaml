# FleetPackage specification for Config Delivery.
# Create it with:
#   gcloud container fleet packages create sft-model-serving \
#     --source=fleet-package/fleetpackage.yaml --location=us-central1
# Update it after changing the tag or specification with:
#   gcloud container fleet packages update sft-model-serving \
#     --source=fleet-package/fleetpackage.yaml --location=us-central1
# The publisher service account packages the variant folder
# fleet-package/environments/default/ of the tag below as plain KRM.
deletionPropagationPolicy: FOREGROUND
resourceBundleSelector:
  cloudBuildRepository:
    name: projects/YOUR_PROJECT_ID/locations/us-central1/connections/YOUR_CONNECTION/repositories/YOUR_REPOSITORY
    path: software-only/bare-metal/sft-model-serving/fleet-package/environments
    serviceAccount: projects/YOUR_PROJECT_ID/serviceAccounts/YOUR_PUBLISHER_SA_NAME@YOUR_PROJECT_ID.iam.gserviceaccount.com
    tag: v1.0.0
rolloutStrategy:
  rolling:
    maxConcurrent: 1
target:
  fleet:
    project: projects/YOUR_PROJECT_ID
    selector:
      matchLabels:
        app-tier: sft-model-serving
variantSelector:
  variantNameTemplate: default
