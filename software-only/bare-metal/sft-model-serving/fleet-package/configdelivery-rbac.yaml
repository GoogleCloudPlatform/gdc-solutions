# Least-privilege RBAC for the Google Cloud Config Delivery service agent on
# each target cluster. Config Delivery only manages RootSync objects in the
# config-management-system namespace, so a namespace-scoped Role and
# RoleBinding is sufficient; do not bind the service agent to cluster-admin.
# Apply on each target cluster before creating the FleetPackage:
#   kubectl apply -f fleet-package/configdelivery-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: configdelivery-rootsync-manager
  namespace: config-management-system
rules:
  - apiGroups:
      - configsync.gke.io
    resources:
      - rootsyncs
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: configdelivery-rootsync-manager
  namespace: config-management-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: configdelivery-rootsync-manager
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: User
    name: service-YOUR_PROJECT_NUMBER@gcp-sa-configdelivery.iam.gserviceaccount.com
