# Optional self-pruning FleetPackage for negative A2A security verification
# (rogue caller rejection and east-west bypass prevention).
# Create it during verification with:
#   gcloud container fleet packages create hybridcloud-agents-a2a-tests \
#     --source=tests/a2a/fleetpackage.yaml --location=us-central1
# Delete it after all verification Jobs complete so Config Delivery prunes
# every test Job, Pod, ServiceAccount, and temporary NetworkPolicy:
#   gcloud container fleet packages delete hybridcloud-agents-a2a-tests \
#     --location=us-central1
deletionPropagationPolicy: FOREGROUND
labels:
  configdelivery-skip-bmctl-clusters: "true"
resourceBundleSelector:
  cloudBuildRepository:
    name: projects/YOUR_PROJECT_ID/locations/us-central1/connections/YOUR_CONNECTION/repositories/YOUR_REPOSITORY
    path: software-only/bare-metal/hybridcloud-agents/tests/a2a/environments
    serviceAccount: projects/YOUR_PROJECT_ID/serviceAccounts/YOUR_PUBLISHER_SA_NAME@YOUR_PROJECT_ID.iam.gserviceaccount.com
    tag: v0.5.5
rolloutStrategy:
  rolling:
    maxConcurrent: 1
target:
  fleet:
    project: projects/YOUR_PROJECT_ID
    selector:
      matchLabels:
        cluster-role: agents
variantSelector:
  variantNameTemplate: "${membership.labels['cluster-role']}"
