# Negative verification Job for unauthorized A2A callers:
#   1. Calling /a2a/sovereign via agent-egress-envoy (:15001) injects an API key
#      that is NOT entitled to the a2a-sovereign-callers API product -> 401/403.
#   2. Calling /a2a/sovereign via ops-egress-envoy (:15001) injects an entitled
#      API key, but presents ServiceAccount/a2a-rogue's projected KSA JWT, which
#      Apigee VerifyJWT rejects because sub != adk-ops-orchestrator -> 401/403.
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: a2a-rogue-probe
    app.kubernetes.io/name: a2a-rogue
    app.kubernetes.io/part-of: hybrid-cloud-agents-tests
  name: a2a-rogue
  namespace: agent-workloads
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: hybrid-cloud-agents-tests
  name: allow-a2a-rogue-caller
  namespace: agent-workloads
spec:
  egress:
    - ports:
        - port: 15001
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: agent-egress-proxy
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: ops-egress-proxy
  podSelector:
    matchLabels:
      app.kubernetes.io/component: a2a-rogue-probe
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: hybrid-cloud-agents-tests
  name: allow-egress-proxies-from-rogue-probe
  namespace: agent-workloads
spec:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: a2a-rogue-probe
      ports:
        - port: 15001
          protocol: TCP
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - agent-egress-proxy
          - ops-egress-proxy
  policyTypes:
    - Ingress
---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/component: a2a-rogue-probe
    app.kubernetes.io/name: a2a-rogue-probe
    app.kubernetes.io/part-of: hybrid-cloud-agents-tests
  name: a2a-rogue-probe
  namespace: agent-workloads
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/component: a2a-rogue-probe
        app.kubernetes.io/name: a2a-rogue-probe
        app.kubernetes.io/part-of: hybrid-cloud-agents-tests
    spec:
      automountServiceAccountToken: false
      containers:
        - command:
            - python3
            - -c
            - |
              import json
              from pathlib import Path
              import sys
              import uuid
              import httpx

              token = Path("/var/run/secrets/tokens/apigee-ksa/token").read_text(encoding="utf-8").strip()
              payload = {
                  "id": f"rogue-{uuid.uuid4()}",
                  "jsonrpc": "2.0",
                  "method": "message/send",
                  "params": {
                      "message": {
                          "messageId": str(uuid.uuid4()),
                          "parts": [{"kind": "text", "text": "Unauthorized rogue A2A probe"}],
                          "role": "user",
                      }
                  },
              }
              headers = {
                  "content-type": "application/json",
                  "x-agent-ksa-token": token,
              }
              checks = [
                  (
                      "unauthorized_api_product",
                      "http://agent-egress-envoy.agent-workloads.svc.cluster.local:15001/a2a/sovereign",
                  ),
                  (
                      "unauthorized_ksa_subject",
                      "http://ops-egress-envoy.agent-workloads.svc.cluster.local:15001/a2a/sovereign",
                  ),
              ]
              results = {}
              failed = False
              with httpx.Client(timeout=15.0) as client:
                for check_name, target_url in checks:
                  resp = client.post(target_url, headers=headers, json=payload)
                  results[check_name] = {
                      "body_excerpt": resp.text[:300],
                      "status_code": resp.status_code,
                      "target_url": target_url,
                  }
                  if resp.status_code not in (401, 403):
                    failed = True

              summary = {
                  "caller_ksa": "system:serviceaccount:agent-workloads:a2a-rogue",
                  "checks": results,
                  "test": "A2A-2-rogue-caller-rejection",
                  "verdict": "FAIL" if failed else "PASS",
              }
              print(json.dumps(summary, sort_keys=True))
              sys.exit(1 if failed else 0)
          image: registry.hybrid-agents.internal/hybrid-cloud-agents/adk-ops-orchestrator:0.1.0@sha256:3f2ed1315766ee96f805df9cbe52c050c5b6cbd700da16b10252b5df333204dc
          name: rogue-probe
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /var/run/secrets/tokens/apigee-ksa
              name: apigee-ksa
              readOnly: true
            - mountPath: /tmp
              name: tmp
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: a2a-rogue
      volumes:
        - name: apigee-ksa
          projected:
            defaultMode: 288
            sources:
              - serviceAccountToken:
                  audience: api.hybrid-agents.internal
                  expirationSeconds: 3600
                  path: token
        - emptyDir:
            medium: Memory
            sizeLimit: 16Mi
          name: tmp
