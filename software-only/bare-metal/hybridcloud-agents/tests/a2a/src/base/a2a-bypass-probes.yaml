# Negative verification Jobs for east-west A2A bypass prevention:
#   1. a2a-direct-pod-bypass-probe runs with adk-ops-orchestrator's exact eBPF
#      NetworkPolicy identity (app.kubernetes.io/component=adk-ops-orchestrator)
#      and verifies direct HTTP (:8080) calls to Service/adk-agent time out.
#   2. a2a-mtls-ingress-bypass-probe connects directly to in-cluster
#      agent-ingress-envoy (:8443) and verifies Envoy's TLS 1.3 mTLS listener
#      rejects both unauthenticated TLS handshakes and rogue client certificates
#      spoofing SAN apigee-runtime.apigee.hybrid-agents.internal.
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/component: a2a-bypass-probe
    app.kubernetes.io/name: a2a-direct-pod-bypass-probe
    app.kubernetes.io/part-of: hybrid-cloud-agents-tests
  name: a2a-direct-pod-bypass-probe
  namespace: agent-workloads
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/component: adk-ops-orchestrator
        app.kubernetes.io/name: a2a-direct-pod-bypass-probe
        app.kubernetes.io/part-of: hybrid-cloud-agents-tests
    spec:
      automountServiceAccountToken: false
      containers:
        - command:
            - python3
            - -c
            - |
              import json
              import sys
              import httpx

              targets = [
                  ("GET", "http://adk-agent.agent-workloads.svc.cluster.local:8080/.well-known/agent-card.json"),
                  ("POST", "http://adk-agent.agent-workloads.svc.cluster.local:8080/"),
              ]
              outcomes = []
              bypass_succeeded = False
              with httpx.Client(timeout=3.0) as client:
                for method, url in targets:
                  try:
                    if method == "GET":
                      resp = client.get(url)
                    else:
                      resp = client.post(url, json={"id": "bypass", "jsonrpc": "2.0", "method": "message/send", "params": {}})
                    bypass_succeeded = True
                    outcomes.append({
                        "blocked": False,
                        "method": method,
                        "status_code": resp.status_code,
                        "url": url,
                    })
                  except httpx.HTTPError as exc:
                    outcomes.append({
                        "blocked": True,
                        "error": f"{type(exc).__name__}: {exc}",
                        "method": method,
                        "url": url,
                    })

              summary = {
                  "caller_identity": "app.kubernetes.io/component=adk-ops-orchestrator",
                  "outcomes": outcomes,
                  "test": "A2A-3a-direct-pod-service-bypass-blocked",
                  "verdict": "FAIL" if bypass_succeeded else "PASS",
              }
              print(json.dumps(summary, sort_keys=True))
              sys.exit(1 if bypass_succeeded else 0)
          image: registry.hybrid-agents.internal/hybrid-cloud-agents/adk-ops-orchestrator:0.1.0@sha256:3f2ed1315766ee96f805df9cbe52c050c5b6cbd700da16b10252b5df333204dc
          name: direct-bypass-probe
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: adk-ops-orchestrator
      volumes:
        - emptyDir:
            medium: Memory
            sizeLimit: 16Mi
          name: tmp
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: a2a-mtls-probe
    app.kubernetes.io/name: a2a-mtls-probe
    app.kubernetes.io/part-of: hybrid-cloud-agents-tests
  name: a2a-mtls-probe
  namespace: agent-workloads
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: hybrid-cloud-agents-tests
  name: allow-a2a-mtls-probe
  namespace: agent-workloads
spec:
  egress:
    - ports:
        - port: 8443
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: agent-ingress-proxy
  podSelector:
    matchLabels:
      app.kubernetes.io/component: a2a-mtls-probe
  policyTypes:
    - Egress
---
apiVersion: batch/v1
kind: Job
metadata:
  labels:
    app.kubernetes.io/component: a2a-mtls-probe
    app.kubernetes.io/name: a2a-mtls-ingress-bypass-probe
    app.kubernetes.io/part-of: hybrid-cloud-agents-tests
  name: a2a-mtls-ingress-bypass-probe
  namespace: agent-workloads
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/component: a2a-mtls-probe
        app.kubernetes.io/name: a2a-mtls-ingress-bypass-probe
        app.kubernetes.io/part-of: hybrid-cloud-agents-tests
    spec:
      automountServiceAccountToken: false
      containers:
        - command:
            - python3
            - -c
            - |
              import datetime
              import json
              from pathlib import Path
              import ssl
              import sys
              from cryptography import x509
              from cryptography.hazmat.primitives import hashes, serialization
              from cryptography.hazmat.primitives.asymmetric import ec
              from cryptography.x509.oid import ExtendedKeyUsageOID, NameOID
              import httpx

              target_url = "https://agent-ingress-envoy.agent-workloads.svc.cluster.local:8443/.well-known/agent-card.json"
              ca_file = "/etc/root-ca/ca.crt"
              outcomes = {}
              bypass_succeeded = False

              # Case 1: TLS 1.3 handshake without a client certificate.
              ctx_no_cert = ssl.create_default_context(cafile=ca_file)
              ctx_no_cert.minimum_version = ssl.TLSVersion.TLSv1_3
              try:
                with httpx.Client(verify=ctx_no_cert, timeout=5.0) as client:
                  resp = client.get(target_url)
                  bypass_succeeded = True
                  outcomes["no_client_cert"] = {"blocked": False, "status_code": resp.status_code}
              except (ssl.SSLError, httpx.HTTPError) as exc:
                outcomes["no_client_cert"] = {"blocked": True, "error": f"{type(exc).__name__}: {exc}"}

              # Case 2: TLS 1.3 handshake with an untrusted client certificate spoofing Apigee's SAN.
              key = ec.generate_private_key(ec.SECP256R1())
              subject = issuer = x509.Name([
                  x509.NameAttribute(NameOID.COMMON_NAME, "apigee-runtime.apigee.hybrid-agents.internal"),
              ])
              now = datetime.datetime.now(datetime.timezone.utc)
              cert = (
                  x509.CertificateBuilder()
                  .subject_name(subject)
                  .issuer_name(issuer)
                  .public_key(key.public_key())
                  .serial_number(x509.random_serial_number())
                  .not_valid_before(now - datetime.timedelta(minutes=5))
                  .not_valid_after(now + datetime.timedelta(hours=1))
                  .add_extension(
                      x509.SubjectAlternativeName([
                          x509.DNSName("apigee-runtime.apigee.hybrid-agents.internal"),
                      ]),
                      critical=False,
                  )
                  .add_extension(
                      x509.ExtendedKeyUsage([ExtendedKeyUsageOID.CLIENT_AUTH]),
                      critical=False,
                  )
                  .sign(key, hashes.SHA256())
              )
              cert_path = Path("/tmp/rogue-client.crt")
              key_path = Path("/tmp/rogue-client.key")
              cert_path.write_bytes(cert.public_bytes(serialization.Encoding.PEM))
              key_path.write_bytes(
                  key.private_bytes(
                      serialization.Encoding.PEM,
                      serialization.PrivateFormat.TraditionalOpenSSL,
                      serialization.NoEncryption(),
                  )
              )

              ctx_rogue = ssl.create_default_context(cafile=ca_file)
              ctx_rogue.minimum_version = ssl.TLSVersion.TLSv1_3
              ctx_rogue.load_cert_chain(certfile=str(cert_path), keyfile=str(key_path))
              try:
                with httpx.Client(verify=ctx_rogue, timeout=5.0) as client:
                  resp = client.get(target_url)
                  bypass_succeeded = True
                  outcomes["spoofed_san_rogue_ca"] = {"blocked": False, "status_code": resp.status_code}
              except (ssl.SSLError, httpx.HTTPError) as exc:
                outcomes["spoofed_san_rogue_ca"] = {"blocked": True, "error": f"{type(exc).__name__}: {exc}"}

              summary = {
                  "outcomes": outcomes,
                  "target_url": target_url,
                  "test": "A2A-3b-mtls-ingress-8443-bypass-blocked",
                  "verdict": "FAIL" if bypass_succeeded else "PASS",
              }
              print(json.dumps(summary, sort_keys=True))
              sys.exit(1 if bypass_succeeded else 0)
          image: registry.hybrid-agents.internal/hybrid-cloud-agents/adk-ops-orchestrator:0.1.0@sha256:3f2ed1315766ee96f805df9cbe52c050c5b6cbd700da16b10252b5df333204dc
          name: mtls-bypass-probe
          resources:
            limits:
              cpu: 250m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/root-ca
              name: root-ca
              readOnly: true
            - mountPath: /tmp
              name: tmp
      restartPolicy: Never
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: a2a-mtls-probe
      volumes:
        - name: root-ca
          secret:
            secretName: hybrid-agents-root-ca-bundle
        - emptyDir:
            medium: Memory
            sizeLimit: 16Mi
          name: tmp
