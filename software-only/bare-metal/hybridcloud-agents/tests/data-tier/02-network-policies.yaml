# Zero-Trust Kubernetes NetworkPolicies for the data-systems Namespace on a
# Sample Data-Tier Test Cluster.
# Replace YOUR_GATEWAY_NODE_CIDR and YOUR_GATEWAY_POD_CIDR before applying with kubectl.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: default-deny-all
  namespace: data-systems
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: allow-dns-egress
  namespace: data-systems
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
  podSelector: {}
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: allow-pgvector-from-gateway-only
  namespace: data-systems
spec:
  ingress:
    - from:
        - ipBlock:
            cidr: YOUR_GATEWAY_NODE_CIDR
        - ipBlock:
            cidr: YOUR_GATEWAY_POD_CIDR
      ports:
        - port: 5432
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pgvector-db
  policyTypes:
    - Ingress
