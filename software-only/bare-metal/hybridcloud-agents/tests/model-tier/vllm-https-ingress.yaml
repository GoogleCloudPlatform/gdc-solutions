# Bundled HTTPS Ingress fronting vllm-service:8000 on the sample gdc-so-model test cluster.
# Uses the bundled istio-ingress gateway in gke-system and references Secret/vllm-ingress-tls
# in gke-system signed by hybrid-agents-ca.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vllm-https-ingress
  namespace: gemma-serving
spec:
  rules:
    - http:
        paths:
          - backend:
              service:
                name: vllm-service
                port:
                  number: 8000
            path: /
            pathType: Prefix
  tls:
    - secretName: vllm-ingress-tls
