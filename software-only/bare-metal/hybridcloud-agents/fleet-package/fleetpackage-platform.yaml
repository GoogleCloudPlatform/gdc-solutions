# FleetPackage specification for the agent-agnostic PLATFORM tier across both
# the Agents cluster (cluster-role=agents -> variant agents-platform) and the
# Gateway and Tools cluster (cluster-role=gateway-tools -> variant
# gateway-tools-platform). Deploy this package first (SRI) before deploying the
# agent-specific hybridcloud-agents FleetPackage (SUG).
#
# Both target memberships carry the shared label hybrid-agents-platform=enabled
# (because Config Delivery's LabelSelector supports matchLabels only) alongside
# their cluster-role label; variantNameTemplate expands
# "${membership.labels['cluster-role']}-platform" per cluster.
#
# Create it with:
#   gcloud container fleet packages create hybridcloud-agents-platform \
#     --source=fleet-package/fleetpackage-platform.yaml --location=us-central1
# Update it after changing the tag or specification with:
#   gcloud container fleet packages update hybridcloud-agents-platform \
#     --source=fleet-package/fleetpackage-platform.yaml --location=us-central1
deletionPropagationPolicy: FOREGROUND
labels:
  configdelivery-skip-bmctl-clusters: "true"
resourceBundleSelector:
  cloudBuildRepository:
    name: projects/YOUR_PROJECT_ID/locations/us-central1/connections/YOUR_CONNECTION/repositories/YOUR_REPOSITORY
    path: software-only/bare-metal/hybridcloud-agents/fleet-package/environments
    serviceAccount: projects/YOUR_PROJECT_ID/serviceAccounts/YOUR_PUBLISHER_SA_NAME@YOUR_PROJECT_ID.iam.gserviceaccount.com
    tag: v0.6.0
rolloutStrategy:
  rolling:
    maxConcurrent: 1
target:
  fleet:
    project: projects/YOUR_PROJECT_ID
    selector:
      matchLabels:
        hybrid-agents-platform: enabled
variantSelector:
  variantNameTemplate: "${membership.labels['cluster-role']}-platform"
