# Shared multi-listener agent egress proxy baseline. Per-agent listeners,
# container ports, Service ports, and SDS API-key secret mounts are wired
# dynamically by fleet-package/render.sh from active registry/agents/*/agent.yaml.
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: agent-egress-proxy
    app.kubernetes.io/name: agent-egress-envoy
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: agent-egress-envoy
  namespace: agent-workloads
---
apiVersion: v1
data:
  envoy.yaml: |
    node:
      id: agent-egress-envoy
      cluster: agent-egress-envoy

    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 9901

    static_resources:
      listeners:
        - name: observability_19000
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 19000
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: envoy_observability
                    route_config:
                      name: readonly_admin_routes
                      virtual_hosts:
                        - name: local_observability
                          domains: ["*"]
                          routes:
                            - match:
                                path: "/ready"
                              route:
                                cluster: envoy_admin_loopback
                            - match:
                                prefix: "/stats/prometheus"
                              route:
                                cluster: envoy_admin_loopback
                            - match:
                                prefix: "/"
                              direct_response:
                                status: 403
                                body:
                                  inline_string: "forbidden\n"
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
        - name: apigee_hybrid_gateway
          type: STRICT_DNS
          dns_lookup_family: V4_ONLY
          connect_timeout: 5s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: apigee_hybrid_gateway
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: api.hybrid-agents.internal
                          port_value: 443
          transport_socket:
            name: envoy.transport_sockets.tls
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
              sni: api.hybrid-agents.internal
              common_tls_context:
                tls_params:
                  tls_minimum_protocol_version: TLSv1_3
                  tls_maximum_protocol_version: TLSv1_3
                tls_certificates:
                  - certificate_chain:
                      filename: /etc/envoy/tls/tls.crt
                    private_key:
                      filename: /etc/envoy/tls/tls.key
                    watched_directory:
                      path: /etc/envoy/tls
                validation_context:
                  trusted_ca:
                    filename: /etc/envoy/root-ca/ca.crt
                  watched_directory:
                    path: /etc/envoy/root-ca
                  match_typed_subject_alt_names:
                    - san_type: DNS
                      matcher:
                        exact: "api.hybrid-agents.internal"

        - name: otel_collector_grpc
          type: STRICT_DNS
          connect_timeout: 2s
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: otel_collector_grpc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: otel-collector.otel-system.svc.cluster.local
                          port_value: 4317

        - name: envoy_admin_loopback
          type: STATIC
          connect_timeout: 1s
          load_assignment:
            cluster_name: envoy_admin_loopback
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 9901
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: agent-egress-proxy
    app.kubernetes.io/name: agent-egress-envoy
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: agent-egress-envoy-config
  namespace: agent-workloads
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: agent-egress-proxy
    app.kubernetes.io/name: agent-egress-envoy
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: agent-egress-envoy
  namespace: agent-workloads
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: agent-egress-proxy
      app.kubernetes.io/name: agent-egress-envoy
  template:
    metadata:
      annotations:
        envoy.hybrid-agents.internal/config-version: v0.7.0-idle
      labels:
        app.kubernetes.io/component: agent-egress-proxy
        app.kubernetes.io/name: agent-egress-envoy
        app.kubernetes.io/part-of: hybrid-cloud-agents
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: agent-egress-envoy
                topologyKey: kubernetes.io/hostname
              weight: 100
      automountServiceAccountToken: false
      containers:
        - args:
            - -c
            - /etc/envoy/envoy.yaml
            - --disable-hot-restart
          image: docker.io/envoyproxy/envoy:v1.33.2@sha256:e2baf0b155d0f54881b54621fdd997e3ec81dc6454f299d4e590afe18256a176
          livenessProbe:
            httpGet:
              path: /ready
              port: 19000
            initialDelaySeconds: 10
            periodSeconds: 10
          name: envoy
          ports:
            - containerPort: 19000
              name: metrics
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: 19000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/envoy
              name: config
              readOnly: true
            - mountPath: /etc/envoy/tls
              name: tls
              readOnly: true
            - mountPath: /etc/envoy/root-ca
              name: root-ca
              readOnly: true
            - mountPath: /tmp
              name: tmp
      securityContext:
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: agent-egress-envoy
      volumes:
        - configMap:
            name: agent-egress-envoy-config
          name: config
        - name: tls
          secret:
            secretName: agent-envoy-egress-client-tls
        - name: root-ca
          secret:
            secretName: hybrid-agents-root-ca-bundle
        - emptyDir:
            medium: Memory
            sizeLimit: 16Mi
          name: tmp
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: agent-egress-envoy-pdb
  namespace: agent-workloads
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: agent-egress-proxy
      app.kubernetes.io/name: agent-egress-envoy
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: agent-egress-proxy
    app.kubernetes.io/name: agent-egress-envoy
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: agent-egress-envoy
  namespace: agent-workloads
spec:
  ports:
    - name: metrics
      port: 19000
      protocol: TCP
      targetPort: 19000
  selector:
    app.kubernetes.io/component: agent-egress-proxy
    app.kubernetes.io/name: agent-egress-envoy
  type: ClusterIP
