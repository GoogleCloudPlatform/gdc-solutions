apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: default-deny-all
  namespace: agent-workloads
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: allow-dns-egress
  namespace: agent-workloads
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
  podSelector: {}
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: allow-adk-agents
  namespace: agent-workloads
spec:
  egress:
    - ports:
        - port: 15001
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: agent-egress-proxy
    - ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: otel-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: otel-collector
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: agent-ingress-proxy
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gmp-system
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              managed-by: stackdriver
      ports:
        - port: 8080
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/component: adk-agent
  policyTypes:
    - Ingress
    - Egress
---
