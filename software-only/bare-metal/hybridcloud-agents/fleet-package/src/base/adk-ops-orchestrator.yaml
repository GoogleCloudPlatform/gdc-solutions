# Includes Agent Registry automatic discovery metadata and GKE Agent Identity
# pod-template SPIFFE annotation for forward compatibility:
#   - https://docs.cloud.google.com/agent-registry/automatic-registration
#   - https://docs.cloud.google.com/kubernetes-engine/security/about-agent-identity
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: adk-ops-orchestrator
    app.kubernetes.io/name: adk-ops-orchestrator
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: adk-ops-orchestrator
  namespace: agent-workloads
---
apiVersion: v1
data:
  peer-agents.json: |
    {
      "discovery_source": "agent-registry-gitops-configmap",
      "peers": {
        "adk-sovereign-agent": {
          "a2a_egress_url": "http://ops-egress-envoy.agent-workloads.svc.cluster.local:15001/a2a/sovereign",
          "agent_card_gateway_url": "https://api.hybrid-agents.internal/agents/sovereign/.well-known/agent-card.json",
          "canonical_gateway_url": "https://api.hybrid-agents.internal/a2a/sovereign",
          "protocol_binding": "HTTP+JSON",
          "required_skill": "sovereign-policy-assessment"
        }
      }
    }
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: adk-ops-orchestrator
    app.kubernetes.io/name: adk-ops-orchestrator
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: adk-ops-orchestrator-config
  namespace: agent-workloads
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    a2a-protocol.org/agent-card: '{"endpoint":"/.well-known/agent-card.json","port":8080,"protocol":"HTTP"}'
  labels:
    app.kubernetes.io/component: adk-ops-orchestrator
    app.kubernetes.io/name: adk-ops-orchestrator
    app.kubernetes.io/part-of: hybrid-cloud-agents
    registry.gke.io/functional-type: AGENT
  name: adk-ops-orchestrator
  namespace: agent-workloads
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: adk-ops-orchestrator
      app.kubernetes.io/name: adk-ops-orchestrator
  template:
    metadata:
      annotations:
        iam.gke.io/spiffe-identity-type: agent-identity
      labels:
        app.kubernetes.io/component: adk-ops-orchestrator
        app.kubernetes.io/name: adk-ops-orchestrator
        app.kubernetes.io/part-of: hybrid-cloud-agents
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: adk-ops-orchestrator
                topologyKey: kubernetes.io/hostname
              weight: 100
      automountServiceAccountToken: false
      containers:
        - env:
            - name: ADK_CAPTURE_MESSAGE_CONTENT_IN_SPANS
              value: "false"
            - name: ADK_CLIENT_MODE
              value: litellm_openai
            - name: CLOUD_MODEL_ALIAS
              value: enterprise-flash
            - name: EGRESS_PROXY_BASE
              value: http://ops-egress-envoy.agent-workloads.svc.cluster.local:15001
            - name: KSA_TOKEN_PATH
              value: /var/run/secrets/tokens/apigee-ksa/token
            - name: LITELLM_LOCAL_MODEL_COST_MAP
              value: "True"
            - name: LITELLM_TELEMETRY
              value: "False"
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://otel-collector.otel-system.svc.cluster.local:4318/v1/traces
            - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
              value: "false"
            - name: PEER_CONFIG_PATH
              value: /etc/adk-config/peer-agents.json
            - name: SOVEREIGN_MODEL_ALIAS
              value: enterprise-sovereign
            - name: SOVEREIGN_MODEL_NAME
              value: google/gemma-4-31B-it
          image: registry.hybrid-agents.internal/hybrid-cloud-agents/adk-ops-orchestrator:0.2.0@sha256:f37a8449d2f2aab9211d439e14aacffdd80abbaec472b353b184368659a546c3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          name: adk-ops-orchestrator
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            limits:
              cpu: 1000m
              memory: 768Mi
            requests:
              cpu: 200m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/adk-config
              name: peer-config
              readOnly: true
            - mountPath: /var/run/secrets/tokens/apigee-ksa
              name: apigee-ksa
              readOnly: true
            - mountPath: /tmp
              name: tmp
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: adk-ops-orchestrator
      volumes:
        - configMap:
            name: adk-ops-orchestrator-config
          name: peer-config
        - name: apigee-ksa
          projected:
            defaultMode: 288
            sources:
              - serviceAccountToken:
                  audience: api.hybrid-agents.internal
                  expirationSeconds: 3600
                  path: token
        - emptyDir:
            medium: Memory
            sizeLimit: 64Mi
          name: tmp
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: adk-ops-orchestrator-pdb
  namespace: agent-workloads
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: adk-ops-orchestrator
      app.kubernetes.io/name: adk-ops-orchestrator
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: adk-ops-orchestrator
    app.kubernetes.io/name: adk-ops-orchestrator
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: adk-ops-orchestrator
  namespace: agent-workloads
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/component: adk-ops-orchestrator
    app.kubernetes.io/name: adk-ops-orchestrator
  type: ClusterIP
