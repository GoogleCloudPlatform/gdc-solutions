apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  labels:
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: agent-envoy-proxies-monitoring
  namespace: agent-workloads
spec:
  endpoints:
    - interval: 30s
      path: /stats/prometheus
      port: metrics
  selector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - agent-ingress-proxy
          - agent-egress-proxy
          - ops-egress-proxy
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  labels:
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: adk-agents-monitoring
  namespace: agent-workloads
spec:
  endpoints:
    - interval: 30s
      path: /metrics
      port: http
  selector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - adk-agent
          - adk-ops-orchestrator
