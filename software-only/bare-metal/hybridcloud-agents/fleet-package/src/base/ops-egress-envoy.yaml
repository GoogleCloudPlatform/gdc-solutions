apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: ops-egress-proxy
    app.kubernetes.io/name: ops-egress-envoy
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: ops-egress-envoy
  namespace: agent-workloads
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/component: ops-egress-proxy
    app.kubernetes.io/name: ops-egress-envoy
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: ops-egress-apigee-api-key
  namespace: agent-workloads
spec:
  data:
    - remoteRef:
        key: apigee-ops-orchestrator-api-key
      secretKey: api-key
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    creationPolicy: Owner
    name: ops-egress-apigee-api-key
---
apiVersion: v1
data:
  envoy.yaml: |
    node:
      id: ops-egress-envoy
      cluster: ops-egress-envoy

    admin:
      address:
        socket_address:
          address: 127.0.0.1
          port_value: 9901

    static_resources:
      listeners:
        - name: ops_egress_15001
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 15001
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ops_apigee_egress
                    codec_type: AUTO
                    generate_request_id: true
                    preserve_external_request_id: true
                    stream_idle_timeout: 360s
                    tracing:
                      provider:
                        name: envoy.tracers.opentelemetry
                        typed_config:
                          "@type": type.googleapis.com/envoy.config.trace.v3.OpenTelemetryConfig
                          grpc_service:
                            envoy_grpc:
                              cluster_name: otel_collector_grpc
                            timeout: 2s
                          service_name: ops-egress-envoy
                      spawn_upstream_span: true
                    route_config:
                      name: ops_egress_routes
                      virtual_hosts:
                        - name: ops_apigee_gateway
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/"
                              route:
                                cluster: agent_egress_gateway
                                timeout: 0s
                                idle_timeout: 360s
                                max_stream_duration:
                                  max_stream_duration: 360s
                    http_filters:
                      - name: envoy.filters.http.credential_injector
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.credential_injector.v3.CredentialInjector
                          overwrite: true
                          allow_request_without_credential: false
                          credential:
                            name: envoy.http.injected_credentials.generic
                            typed_config:
                              "@type": type.googleapis.com/envoy.extensions.http.injected_credentials.generic.v3.Generic
                              credential:
                                name: apigee_ops_orchestrator_api_key
                                sds_config:
                                  resource_api_version: V3
                                  path_config_source:
                                    path: /etc/envoy/sds-apigee-key.yaml
                              header: x-api-key
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

        - name: observability_19000
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 19000
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: envoy_observability
                    route_config:
                      name: readonly_admin_routes
                      virtual_hosts:
                        - name: local_observability
                          domains: ["*"]
                          routes:
                            - match:
                                path: "/ready"
                              route:
                                cluster: envoy_admin_loopback
                            - match:
                                prefix: "/stats/prometheus"
                              route:
                                cluster: envoy_admin_loopback
                            - match:
                                prefix: "/"
                              direct_response:
                                status: 403
                                body:
                                  inline_string: "forbidden\n"
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

      clusters:
        - name: agent_egress_gateway
          type: STRICT_DNS
          connect_timeout: 5s
          lb_policy: ROUND_ROBIN
          load_assignment:
            cluster_name: agent_egress_gateway
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: agent-egress-envoy.agent-workloads.svc.cluster.local
                          port_value: 15001

        - name: otel_collector_grpc
          type: STRICT_DNS
          connect_timeout: 2s
          lb_policy: ROUND_ROBIN
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              explicit_http_config:
                http2_protocol_options: {}
          load_assignment:
            cluster_name: otel_collector_grpc
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: otel-collector.otel-system.svc.cluster.local
                          port_value: 4317

        - name: envoy_admin_loopback
          type: STATIC
          connect_timeout: 1s
          load_assignment:
            cluster_name: envoy_admin_loopback
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: 127.0.0.1
                          port_value: 9901
  sds-apigee-key.yaml: |
    resources:
      - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
        name: apigee_ops_orchestrator_api_key
        generic_secret:
          secret:
            filename: /etc/envoy/apigee-key/api-key
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: ops-egress-proxy
    app.kubernetes.io/name: ops-egress-envoy
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: ops-egress-envoy-config
  namespace: agent-workloads
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: ops-egress-proxy
    app.kubernetes.io/name: ops-egress-envoy
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: ops-egress-envoy
  namespace: agent-workloads
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: ops-egress-proxy
      app.kubernetes.io/name: ops-egress-envoy
  template:
    metadata:
      labels:
        app.kubernetes.io/component: ops-egress-proxy
        app.kubernetes.io/name: ops-egress-envoy
        app.kubernetes.io/part-of: hybrid-cloud-agents
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: ops-egress-envoy
                topologyKey: kubernetes.io/hostname
              weight: 100
      automountServiceAccountToken: false
      containers:
        - args:
            - -c
            - /etc/envoy/envoy.yaml
            - --disable-hot-restart
          image: docker.io/envoyproxy/envoy:v1.33.2@sha256:e2baf0b155d0f54881b54621fdd997e3ec81dc6454f299d4e590afe18256a176
          livenessProbe:
            httpGet:
              path: /ready
              port: 19000
            initialDelaySeconds: 10
            periodSeconds: 10
          name: envoy
          ports:
            - containerPort: 15001
              name: http-egress
              protocol: TCP
            - containerPort: 19000
              name: metrics
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: 19000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/envoy
              name: config
              readOnly: true
            - mountPath: /etc/envoy/apigee-key
              name: apigee-key
              readOnly: true
            - mountPath: /tmp
              name: tmp
      securityContext:
        runAsGroup: 101
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: ops-egress-envoy
      volumes:
        - configMap:
            name: ops-egress-envoy-config
          name: config
        - name: apigee-key
          secret:
            secretName: ops-egress-apigee-api-key
        - emptyDir:
            medium: Memory
            sizeLimit: 16Mi
          name: tmp
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ops-egress-envoy-pdb
  namespace: agent-workloads
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: ops-egress-proxy
      app.kubernetes.io/name: ops-egress-envoy
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: ops-egress-proxy
    app.kubernetes.io/name: ops-egress-envoy
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: ops-egress-envoy
  namespace: agent-workloads
spec:
  ports:
    - name: http-egress
      port: 15001
      protocol: TCP
      targetPort: 15001
  selector:
    app.kubernetes.io/component: ops-egress-proxy
    app.kubernetes.io/name: ops-egress-envoy
  type: ClusterIP
