# Includes Agent Registry automatic discovery label and annotation for forward
# compatibility: https://docs.cloud.google.com/agent-registry/automatic-registration
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: adk-agent
    app.kubernetes.io/name: adk-sovereign-agent
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: adk-sovereign-agent
  namespace: agent-workloads
---
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    a2a-protocol.org/agent-card: '{"endpoint":"/.well-known/agent-card.json","port":8080,"protocol":"HTTP"}'
  labels:
    app.kubernetes.io/component: adk-agent
    app.kubernetes.io/name: adk-sovereign-agent
    app.kubernetes.io/part-of: hybrid-cloud-agents
    registry.gke.io/functional-type: AGENT
  name: adk-sovereign-agent
  namespace: agent-workloads
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: adk-agent
      app.kubernetes.io/name: adk-sovereign-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/component: adk-agent
        app.kubernetes.io/name: adk-sovereign-agent
        app.kubernetes.io/part-of: hybrid-cloud-agents
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: adk-sovereign-agent
                topologyKey: kubernetes.io/hostname
              weight: 100
      automountServiceAccountToken: false
      containers:
        - env:
            - name: ADK_CAPTURE_MESSAGE_CONTENT_IN_SPANS
              value: "false"
            - name: ADK_CLIENT_MODE
              value: litellm_openai
            - name: EGRESS_PROXY_BASE
              value: http://agent-egress-envoy.agent-workloads.svc.cluster.local:15001
            - name: KSA_TOKEN_PATH
              value: /var/run/secrets/tokens/apigee-ksa/token
            - name: LITELLM_LOCAL_MODEL_COST_MAP
              value: "True"
            - name: LITELLM_TELEMETRY
              value: "False"
            - name: MODEL_ALIAS
              value: enterprise-sovereign
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: http://otel-collector.otel-system.svc.cluster.local:4318/v1/traces
            - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
              value: "false"
            - name: SOVEREIGN_MODEL_NAME
              value: google/gemma-4-31B-it
          image: registry.hybrid-agents.internal/hybrid-cloud-agents/adk-sovereign-agent:0.1.2@sha256:9cbd8b4eac80a627542ca90fbdc5c133c477d18c51372fa9898f415d3c4395bf
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          name: adk-agent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            limits:
              cpu: 1000m
              memory: 768Mi
            requests:
              cpu: 200m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /var/run/secrets/tokens/apigee-ksa
              name: apigee-ksa
              readOnly: true
            - mountPath: /tmp
              name: tmp
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: adk-sovereign-agent
      volumes:
        - name: apigee-ksa
          projected:
            defaultMode: 288
            sources:
              - serviceAccountToken:
                  audience: api.hybrid-agents.internal
                  expirationSeconds: 3600
                  path: token
        - emptyDir:
            medium: Memory
            sizeLimit: 64Mi
          name: tmp
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: adk-sovereign-agent-pdb
  namespace: agent-workloads
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: adk-agent
      app.kubernetes.io/name: adk-sovereign-agent
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: adk-agent
    app.kubernetes.io/name: adk-sovereign-agent
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: adk-agent
  namespace: agent-workloads
spec:
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/component: adk-agent
    app.kubernetes.io/name: adk-sovereign-agent
  type: ClusterIP
