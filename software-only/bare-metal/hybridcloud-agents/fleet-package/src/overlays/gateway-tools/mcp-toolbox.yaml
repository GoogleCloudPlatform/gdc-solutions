apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/part-of: hybrid-cloud-agents
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
  name: mcp-tools
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: pgvector-db-creds
  namespace: mcp-tools
spec:
  data:
    - remoteRef:
        key: hybrid-agents-pgvector-creds
        property: PG_DATABASE
      secretKey: PG_DATABASE
    - remoteRef:
        key: hybrid-agents-pgvector-creds
        property: PG_USER
      secretKey: PG_USER
    - remoteRef:
        key: hybrid-agents-pgvector-creds
        property: PG_PASSWORD
      secretKey: PG_PASSWORD
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: gcp-secret-manager
  target:
    creationPolicy: Owner
    name: pgvector-db-creds
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: mcp-toolbox-tls
  namespace: mcp-tools
spec:
  commonName: mcp-toolbox.mcp-tools.svc.cluster.local
  dnsNames:
    - mcp-toolbox.mcp-tools.svc.cluster.local
    - mcp-toolbox.mcp-tools
    - mcp-toolbox
  duration: 2160h
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: hybrid-agents-ca
  privateKey:
    algorithm: ECDSA
    rotationPolicy: Always
    size: 256
  renewBefore: 360h
  secretName: mcp-toolbox-tls
  usages:
    - server auth
    - digital signature
    - key encipherment
---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/component: mcp-toolbox
    app.kubernetes.io/name: mcp-toolbox
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: mcp-toolbox-sa
  namespace: mcp-tools
---
apiVersion: v1
data:
  tools.yaml: |
    kind: source
    name: sovereign-pgvector
    type: postgres
    host: YOUR_PGVECTOR_HOST
    port: "5432"
    database: ${PG_DATABASE}
    user: ${PG_USER}
    password: ${PG_PASSWORD}
    queryParams:
      sslmode: verify-full
      sslrootcert: /etc/toolbox/tls/ca.crt
    ---
    kind: tool
    name: search_sovereign_policies_by_category
    type: postgres-sql
    source: sovereign-pgvector
    description: >-
      Retrieve synthetic sovereign enterprise compliance policies matching a category
      (for example: residency, network, identity, observability, or burst).
    parameters:
      - name: category
        type: string
        description: Policy category filter (e.g., residency, network, identity, observability, burst).
    statement: >-
      SELECT policy_id, category, data_classification, title, summary
      FROM sovereign_compliance_policies
      WHERE category = $1
      ORDER BY policy_id
      LIMIT 10;
    ---
    kind: tool
    name: semantic_search_sovereign_policies
    type: postgres-sql
    source: sovereign-pgvector
    description: >-
      Perform pgvector cosine-distance semantic search over synthetic sovereign compliance
      policies given an 8-dimensional embedding vector literal (e.g., '[0.9,0.1,0.05,0.1,0.1,0.05,0.05,0.2]').
    parameters:
      - name: query_embedding
        type: string
        description: Bracketed 8-float pgvector literal, e.g. '[0.9,0.1,0.05,0.1,0.1,0.05,0.05,0.2]'.
      - name: top_k
        type: integer
        description: Maximum number of nearest-neighbor policies to return (1 to 5).
    statement: >-
      SELECT policy_id, category, data_classification, title, summary,
             ROUND((1 - (embedding <=> CAST($1 AS vector)))::numeric, 4) AS cosine_similarity
      FROM sovereign_compliance_policies
      ORDER BY embedding <=> CAST($1 AS vector)
      LIMIT $2;
    ---
    kind: toolset
    name: sovereign_governance_tools
    tools:
      - search_sovereign_policies_by_category
      - semantic_search_sovereign_policies
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: mcp-toolbox
    app.kubernetes.io/name: mcp-toolbox
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: mcp-toolbox-config
  namespace: mcp-tools
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: mcp-toolbox
    app.kubernetes.io/name: mcp-toolbox
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: mcp-toolbox
  namespace: mcp-tools
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp-toolbox
      app.kubernetes.io/name: mcp-toolbox
  template:
    metadata:
      labels:
        app.kubernetes.io/component: mcp-toolbox
        app.kubernetes.io/name: mcp-toolbox
        app.kubernetes.io/part-of: hybrid-cloud-agents
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - --address
            - 0.0.0.0
            - --port
            - "8443"
            - --config
            - /etc/toolbox/config/tools.yaml
            - --tls-cert
            - /etc/toolbox/tls/tls.crt
            - --tls-key
            - /etc/toolbox/tls/tls.key
            - --disable-version-check
            - --logging-format
            - JSON
          env:
            - name: PG_HOST
              value: YOUR_PGVECTOR_HOST
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef:
                  key: PG_DATABASE
                  name: pgvector-db-creds
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  key: PG_USER
                  name: pgvector-db-creds
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: PG_PASSWORD
                  name: pgvector-db-creds
          image: us-central1-docker.pkg.dev/database-toolbox/toolbox/toolbox:1.15.0@sha256:7e4f7bfd93ccec33c066563a4ca700572e4ce95a8d45ba18577df8ee50b9481a
          livenessProbe:
            initialDelaySeconds: 10
            periodSeconds: 10
            tcpSocket:
              port: https-mcp
          name: toolbox
          ports:
            - containerPort: 8443
              name: https-mcp
              protocol: TCP
          readinessProbe:
            initialDelaySeconds: 3
            periodSeconds: 5
            tcpSocket:
              port: https-mcp
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/toolbox/config
              name: config
              readOnly: true
            - mountPath: /etc/toolbox/tls
              name: tls
              readOnly: true
            - mountPath: /tmp
              name: tmp
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: mcp-toolbox-sa
      volumes:
        - configMap:
            name: mcp-toolbox-config
          name: config
        - name: tls
          secret:
            defaultMode: 288
            secretName: mcp-toolbox-tls
        - emptyDir:
            medium: Memory
            sizeLimit: 16Mi
          name: tmp
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: mcp-toolbox-pdb
  namespace: mcp-tools
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: mcp-toolbox
      app.kubernetes.io/name: mcp-toolbox
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: mcp-toolbox
    app.kubernetes.io/name: mcp-toolbox
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: mcp-toolbox
  namespace: mcp-tools
spec:
  ports:
    - name: https-mcp
      port: 8443
      protocol: TCP
      targetPort: https-mcp
  selector:
    app.kubernetes.io/component: mcp-toolbox
    app.kubernetes.io/name: mcp-toolbox
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: default-deny-all
  namespace: mcp-tools
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: allow-dns-egress
  namespace: mcp-tools
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
  podSelector: {}
  policyTypes:
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: allow-mcp-toolbox
  namespace: mcp-tools
spec:
  egress:
    - ports:
        - port: 5432
          protocol: TCP
      to:
        - ipBlock:
            cidr: YOUR_DATA_SYSTEMS_CIDR
    - ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: otel-system
          podSelector:
            matchLabels:
              app.kubernetes.io/component: otel-collector
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: apigee
      ports:
        - port: 8443
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/component: mcp-toolbox
      app.kubernetes.io/name: mcp-toolbox
  policyTypes:
    - Ingress
    - Egress
