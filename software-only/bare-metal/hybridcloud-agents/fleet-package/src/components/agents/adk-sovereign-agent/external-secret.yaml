apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  labels:
    app.kubernetes.io/component: agent-egress-proxy
    app.kubernetes.io/name: agent-egress-envoy
    app.kubernetes.io/part-of: hybrid-cloud-agents
  name: agent-egress-apigee-api-key
  namespace: agent-workloads
spec:
  data:
    - remoteRef:
        key: apigee-sovereign-agent-api-key
      secretKey: api_key
  refreshInterval: 15m
  secretStoreRef:
    kind: SecretStore
    name: gcp-secret-manager
  target:
    creationPolicy: Owner
    name: agent-egress-apigee-api-key
    template:
      data:
        api-key: "{{ .api_key }}"
        sds-apigee-key.yaml: |
          resources:
            - "@type": type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.Secret
              name: apigee_sovereign_api_key
              generic_secret:
                secret:
                  inline_string: "{{ .api_key }}"
      engineVersion: v2
