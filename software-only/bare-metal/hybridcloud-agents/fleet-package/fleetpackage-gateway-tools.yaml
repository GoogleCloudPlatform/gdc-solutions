# FleetPackage specification for the Gateway and Tools cluster tier
# (cluster-role=gateway-tools).
# Note: Google Cloud Config Delivery's LabelSelector protobuf
# (configdelivery_v1_messages.LabelSelector) only supports matchLabels and
# rejects matchExpressions, so the gateway-tools tier uses a companion
# FleetPackage resource pointing at the shared fleet-package/environments/
# directory with variantNameTemplate: "${membership.labels['cluster-role']}".
# Create it with:
#   gcloud container fleet packages create hybridcloud-agents-gateway-tools \
#     --source=fleet-package/fleetpackage-gateway-tools.yaml --location=us-central1
# Update it after changing the tag or specification with:
#   gcloud container fleet packages update hybridcloud-agents-gateway-tools \
#     --source=fleet-package/fleetpackage-gateway-tools.yaml --location=us-central1
deletionPropagationPolicy: FOREGROUND
labels:
  configdelivery-skip-bmctl-clusters: "true"
resourceBundleSelector:
  cloudBuildRepository:
    name: projects/YOUR_PROJECT_ID/locations/us-central1/connections/YOUR_CONNECTION/repositories/YOUR_REPOSITORY
    path: software-only/bare-metal/hybridcloud-agents/fleet-package/environments
    serviceAccount: projects/YOUR_PROJECT_ID/serviceAccounts/YOUR_PUBLISHER_SA_NAME@YOUR_PROJECT_ID.iam.gserviceaccount.com
    tag: v0.5.4
rolloutStrategy:
  rolling:
    maxConcurrent: 1
target:
  fleet:
    project: projects/YOUR_PROJECT_ID
    selector:
      matchLabels:
        cluster-role: gateway-tools
variantSelector:
  variantNameTemplate: "${membership.labels['cluster-role']}"
