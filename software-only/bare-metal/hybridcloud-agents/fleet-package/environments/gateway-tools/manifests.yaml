      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20
      resource:
        attributes:
          - key: gcp.project_id
            value: YOUR_PROJECT_ID
            action: upsert
          - key: cloud.region
            value: us-central1
            action: upsert
          - key: k8s.cluster.name
            value: YOUR_GATEWAY_CLUSTER_NAME
            action: upsert
          - key: service.namespace
            value: hybrid-cloud-agents
            action: insert
          - key: service.instance.id
            value: ${env:POD_NAME}
            action: insert
      transform/sovereign_redaction:
        error_mode: ignore
        trace_statements:
          - context: span
            statements:
              - delete_key(span.attributes, "gen_ai.prompt") where span.attributes["data_classification"] == "sovereign" or resource.attributes["data_classification"] == "sovereign"
              - delete_key(span.attributes, "gen_ai.completion") where span.attributes["data_classification"] == "sovereign" or resource.attributes["data_classification"] == "sovereign"
              - delete_key(span.attributes, "gen_ai.input.messages") where span.attributes["data_classification"] == "sovereign" or resource.attributes["data_classification"] == "sovereign"
              - delete_key(span.attributes, "gen_ai.output.messages") where span.attributes["data_classification"] == "sovereign" or resource.attributes["data_classification"] == "sovereign"
        log_statements:
          - context: log
            statements:
              - set(log.body, "[REDACTED_SOVEREIGN_CONTENT]") where log.attributes["data_classification"] == "sovereign" and log.attributes["gen_ai.content"] != nil
              - delete_key(log.attributes, "gen_ai.content") where log.attributes["data_classification"] == "sovereign"
      batch:
        send_batch_max_size: 200
        send_batch_size: 100
        timeout: 2s
    exporters:
      googlecloud:
        project: YOUR_PROJECT_ID
        log:
          default_log_name: hybrid-agents-otel
    service:
      telemetry:
        metrics:
          level: basic
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, transform/sovereign_redaction, batch]
          exporters: [googlecloud]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [googlecloud]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, transform/sovereign_redaction, batch]
          exporters: [googlecloud]
