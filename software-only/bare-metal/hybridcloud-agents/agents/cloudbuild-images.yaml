# Cloud Build config for building and pushing the hardened Google ADK sample
# agent container images (adk-sovereign-agent and adk-ops-orchestrator) to an
# Artifact Registry Docker repository.
options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - args:
      - -c
      - |
        set -euo pipefail
        if [[ -d "software-only/bare-metal/hybridcloud-agents/agents" ]]; then
          PKG_ROOT="software-only/bare-metal/hybridcloud-agents"
        else
          PKG_ROOT="."
        fi
        REPO_PREFIX="${_AR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}"
        for AGENT in adk-sovereign-agent adk-ops-orchestrator; do
          cp "$${PKG_ROOT}/registry/cards/$${AGENT}.json" "$${PKG_ROOT}/agents/$${AGENT}/agent-card.json"
          IMAGE_URI="$${REPO_PREFIX}/$${AGENT}:${_IMAGE_TAG}"
          docker build -t "$${IMAGE_URI}" "$${PKG_ROOT}/agents/$${AGENT}"
          rm -f "$${PKG_ROOT}/agents/$${AGENT}/agent-card.json"
          docker run --rm --entrypoint python "$${IMAGE_URI}" -m pip show google-adk | grep -E "^(Name|Version):"
          docker push "$${IMAGE_URI}"
        done
        echo "=== Built Agent Image Digests ==="
        for AGENT in adk-sovereign-agent adk-ops-orchestrator; do
          IMAGE_URI="$${REPO_PREFIX}/$${AGENT}:${_IMAGE_TAG}"
          DIGEST="$$(docker inspect --format='{{index .RepoDigests 0}}' "$${IMAGE_URI}")"
          echo "$${AGENT}: $${DIGEST}"
        done
    entrypoint: bash
    id: build-and-push-agent-images
    name: gcr.io/cloud-builders/docker
substitutions:
  _AR_LOCATION: us-central1
  _AR_REPOSITORY: hybrid-cloud-agents
  _IMAGE_TAG: v0.5.5
