description: Governed pass-through MCP proxy (mcp-bigquery-v1) to Google Cloud BigQuery remote MCP server with mutating tool stripping.
displayName: mcp-bigquery
interface:
  protocolBinding: JSONRPC
  url: https://YOUR_GATEWAY_FQDN/mcp-bigquery
name: mcp-bigquery
tools:
  - annotations:
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true
      readOnlyHint: true
      title: List BigQuery Dataset IDs
    description: Lists dataset IDs in the governed Google Cloud project via BigQuery MCP.
    inputSchema:
      properties:
        projectId:
          description: Google Cloud project ID.
          type: string
      type: object
    name: list_dataset_ids
  - annotations:
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true
      readOnlyHint: true
      title: Get BigQuery Dataset Info
    description: Retrieves metadata for a BigQuery dataset via BigQuery MCP.
    inputSchema:
      properties:
        datasetId:
          description: BigQuery dataset ID.
          type: string
        projectId:
          description: Google Cloud project ID.
          type: string
      required:
        - datasetId
      type: object
    name: get_dataset_info
  - annotations:
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true
      readOnlyHint: true
      title: List BigQuery Table IDs
    description: Lists table IDs within a BigQuery dataset via BigQuery MCP.
    inputSchema:
      properties:
        datasetId:
          description: BigQuery dataset ID.
          type: string
        projectId:
          description: Google Cloud project ID.
          type: string
      required:
        - datasetId
      type: object
    name: list_table_ids
  - annotations:
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true
      readOnlyHint: true
      title: Get BigQuery Table Info
    description: Retrieves schema and metadata for a BigQuery table via BigQuery MCP.
    inputSchema:
      properties:
        datasetId:
          description: BigQuery dataset ID.
          type: string
        projectId:
          description: Google Cloud project ID.
          type: string
        tableId:
          description: BigQuery table ID.
          type: string
      required:
        - datasetId
        - tableId
      type: object
    name: get_table_info
