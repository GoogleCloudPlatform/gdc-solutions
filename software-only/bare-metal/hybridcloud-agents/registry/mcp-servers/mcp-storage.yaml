description: Governed pass-through MCP proxy (mcp-storage-v1) to Google Cloud Storage remote MCP server with mutating tool stripping.
displayName: mcp-storage
interface:
  protocolBinding: JSONRPC
  url: https://YOUR_GATEWAY_FQDN/mcp-storage
name: mcp-storage
tools:
  - annotations:
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true
      readOnlyHint: true
      title: List Cloud Storage Objects
    description: Lists objects in a governed Cloud Storage bucket via Storage MCP.
    inputSchema:
      properties:
        bucket:
          description: Cloud Storage bucket name.
          type: string
        prefix:
          description: Optional object key prefix filter.
          type: string
      required:
        - bucket
      type: object
    name: list_objects
  - annotations:
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true
      readOnlyHint: true
      title: Get Cloud Storage Bucket Metadata
    description: Retrieves metadata for a governed Cloud Storage bucket via Storage MCP.
    inputSchema:
      properties:
        bucket:
          description: Cloud Storage bucket name.
          type: string
      required:
        - bucket
      type: object
    name: get_bucket_metadata
  - annotations:
      destructiveHint: false
      idempotentHint: true
      openWorldHint: true
      readOnlyHint: true
      title: Get Cloud Storage Object Metadata
    description: Retrieves metadata for a specific object in a governed Cloud Storage bucket.
    inputSchema:
      properties:
        bucket:
          description: Cloud Storage bucket name.
          type: string
        object:
          description: Object name inside the bucket.
          type: string
      required:
        - bucket
        - object
      type: object
    name: get_object_metadata
