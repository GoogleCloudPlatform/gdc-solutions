description: Governed on-premises MCP Toolbox for Databases (PostgreSQL and pgvector) behind Apigee hybrid mcp-toolbox-v1.
displayName: mcp-toolbox
interface:
  protocolBinding: JSONRPC
  url: https://YOUR_GATEWAY_FQDN/mcp-toolbox
name: mcp-toolbox
tools:
  - annotations:
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
      readOnlyHint: true
      title: Search Sovereign Policies by Category
    description: Queries on-premises PostgreSQL sovereign_policies rows filtered by policy category.
    inputSchema:
      properties:
        category:
          description: Policy category filter (for example data-residency or model-governance).
          type: string
      required:
        - category
      type: object
    name: search_sovereign_policies_by_category
  - annotations:
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
      readOnlyHint: true
      title: Semantic Search Sovereign Policies
    description: Performs pgvector cosine-distance similarity search over on-premises sovereign policy embeddings.
    inputSchema:
      properties:
        query_embedding:
          description: Bracketed 768-dimensional float vector string.
          type: string
      required:
        - query_embedding
      type: object
    name: semantic_search_sovereign_policies
