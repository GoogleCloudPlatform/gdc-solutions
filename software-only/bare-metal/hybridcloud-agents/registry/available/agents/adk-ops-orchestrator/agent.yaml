a2aPeers:
  - a2aPath: /a2a/sovereign
    agentCardGatewayPath: /agents/sovereign/.well-known/agent-card.json
    name: adk-sovereign-agent
    protocolBinding: HTTP+JSON
    requiredSkill: sovereign-policy-assessment
agentCard: cards/adk-ops-orchestrator.json
allowedModelAliases:
  - enterprise-sovereign
  - enterprise-flash
  - google/gemma-4-31B-it
  - google/gemini-3.5-flash
apiProducts:
  - allowCloudBurst: "true"
    llmTokenQuotaInterval: "1"
    llmTokenQuotaLimit: "500000"
    llmTokenQuotaTimeUnit: hour
    name: cloud-eligible-agents
    promptTokenRate: 2400pm
    spikeArrestRate: 30ps
  - name: cloud-eligible-agents-mcp
    spikeArrestRate: 30ps
    toolQuotaInterval: "1"
    toolQuotaLimit: "60"
    toolQuotaTimeUnit: minute
  - name: a2a-sovereign-callers
    spikeArrestRate: 30ps
apigeeApp:
  businessUnit: corp-it
  costCenter: CC-OPS-205
  developerEmail: hybrid-agents-platform@example.com
  name: ops-orchestrator-app
egressProxy:
  endpoint: http://agent-egress-envoy.agent-workloads.svc.cluster.local:15002
  mountPath: /etc/envoy/ops-apigee-key
  port: 15002
  portName: ops-egress
  sdsSecretName: apigee_ops_orchestrator_api_key
  secretName: ops-egress-apigee-api-key
  service: agent-egress-envoy
  statPrefix: ops_apigee_egress
  volumeName: ops-apigee-key
exposedMcpServers:
  - mcp-toolbox
  - mcp-bigquery
  - mcp-storage
ingressProxy:
  clusterName: adk_ops_orchestrator_cluster
  pathPrefix: /ops-orchestrator
  serviceName: adk-ops-orchestrator
  servicePort: 8080
kubernetesIdentity:
  componentLabel: adk-ops-orchestrator
  expectedJwtSubject: system:serviceaccount:agent-workloads:adk-ops-orchestrator
  namespace: agent-workloads
  serviceAccount: adk-ops-orchestrator
name: adk-ops-orchestrator
secretManagerSecret: apigee-ops-orchestrator-api-key
