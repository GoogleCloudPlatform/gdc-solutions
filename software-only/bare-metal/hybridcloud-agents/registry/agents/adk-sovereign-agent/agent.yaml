agentCard: cards/adk-sovereign-agent.json
allowedModelAliases:
  - enterprise-sovereign
  - google/gemma-4-31B-it
apiProducts:
  - allowCloudBurst: "false"
    llmTokenQuotaInterval: "1"
    llmTokenQuotaLimit: "500000"
    llmTokenQuotaTimeUnit: hour
    name: sovereign-agents
    promptTokenRate: 120000pm
    spikeArrestRate: 30ps
  - name: sovereign-agents-mcp
    spikeArrestRate: 30ps
    toolQuotaInterval: "1"
    toolQuotaLimit: "60"
    toolQuotaTimeUnit: minute
apigeeApp:
  businessUnit: fab-etch
  costCenter: CC-FAB-410
  developerEmail: hybrid-agents-platform@example.com
  name: sovereign-agents-app
exposedMcpServers:
  - mcp-toolbox
kubernetesIdentity:
  expectedJwtSubject: system:serviceaccount:agent-workloads:adk-sovereign-agent
  namespace: agent-workloads
  serviceAccount: adk-sovereign-agent
name: adk-sovereign-agent
secretManagerSecret: apigee-sovereign-agent-api-key
