info:
  description: >-
    Synthetic read-only gateway topology and approved model-tier catalog exposed
    as native MCP tools by Apigee hybrid 1.17 apigee-mcp-server (Track A).
  title: Hybrid Cloud AI Agents Gateway Catalog API
  version: 1.0.0
openapi: 3.0.3
paths:
  /gateway-catalog/models:
    get:
      description: Lists sovereign local vLLM and cloud-eligible Vertex AI Gemini model IDs.
      operationId: listApprovedModelTiers
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Approved model tiers JSON
      summary: Lists approved sovereign and cloud-burst model tiers behind Apigee.
  /gateway-catalog/status:
    get:
      description: Returns cluster names, mTLS posture, and keyless WIF status.
      operationId: getGatewayTopologyStatus
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
          description: Gateway topology status JSON
      summary: Returns the live 3-cluster hybrid agent gateway topology status.
servers:
  - url: https://api.hybrid-agents.internal
