# Cloud Build configuration for building and pushing flwr-trainer and flwr-superlink
# container images into your Artifact Registry Docker repository.

options:
  logging: CLOUD_LOGGING_ONLY
steps:
  - args:
      - -c
      - |
        set -o errexit
        set -o nounset
        set -o pipefail
        if [[ -d "software-only/bare-metal/fed-lora/docker" ]]; then
          PKG_ROOT="software-only/bare-metal/fed-lora"
        else
          PKG_ROOT="."
        fi
        REPO_PREFIX="${_AR_LOCATION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPOSITORY}"
        docker build -f "$${PKG_ROOT}/docker/Dockerfile.trainer" \
          -t "$${REPO_PREFIX}/flwr-trainer:${_IMAGE_TAG}" "$${PKG_ROOT}/docker"
        docker push "$${REPO_PREFIX}/flwr-trainer:${_IMAGE_TAG}"
        docker build -f "$${PKG_ROOT}/docker/Dockerfile.superlink" \
          -t "$${REPO_PREFIX}/flwr-superlink:${_IMAGE_TAG}" "$${PKG_ROOT}/docker"
        docker push "$${REPO_PREFIX}/flwr-superlink:${_IMAGE_TAG}"
    entrypoint: bash
    id: build-and-push-fed-lora-images
    name: gcr.io/cloud-builders/docker
substitutions:
  _AR_LOCATION: us-central1
  _AR_REPOSITORY: YOUR_AR_REPO
  _IMAGE_TAG: v2.1.6
