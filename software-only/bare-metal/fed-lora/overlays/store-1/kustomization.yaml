apiVersion: kustomize.config.k8s.io/v1beta1
configMapGenerator:
  - files:
      - train.jsonl=data/train.jsonl
    name: store-training-data
    namespace: fed-lora-poc
    options:
      disableNameSuffixHash: true
kind: Kustomization
labels:
  - includeSelectors: false
    pairs:
      fed-lora.gdcso.google.com/store: store-1
patches:
  - patch: |-
      - op: replace
        path: /spec/clusterName
        value: YOUR_STORE_1_CLUSTER
    target:
      group: addons.gke.io
      kind: Stackdriver
      name: stackdriver
      namespace: kube-system
      version: v1alpha1
  - patch: |-
      - op: add
        path: /spec/loadBalancerIP
        value: 10.200.0.131
    target:
      kind: Service
      name: vllm-service
  - patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "1"
    target:
      kind: Deployment
      name: flwr-supernode
  - patch: |-
      - op: replace
        path: /spec/template/spec/initContainers/1/env/0/value
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "1"
    target:
      kind: Deployment
      name: flwr-trainer
resources:
  - ../../base/vllm-serving
  - ../../base/credentials
  - ../../base/flwr-client
  - ../../base/monitoring
