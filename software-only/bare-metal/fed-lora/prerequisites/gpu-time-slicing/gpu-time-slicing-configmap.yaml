apiVersion: v1
data:
  any: |-
    version: v1
    flags:
      migStrategy: none
    sharing:
      timeSlicing:
        renameByDefault: false
        failRequestsGreaterThanOne: false
        resources:
        - name: nvidia.com/gpu
          replicas: 2
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/component: gpu-time-slicing
    app.kubernetes.io/part-of: fed-lora-poc
  name: time-slicing-config
  namespace: gpu-operator
