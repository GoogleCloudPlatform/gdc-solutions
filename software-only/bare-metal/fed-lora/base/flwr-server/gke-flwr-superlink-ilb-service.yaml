# Flower SuperLink Internal LoadBalancer Service
# Exposes FleetAPI (port 9092) and ExecAPI (port 9093) at static internal IP 10.200.0.50

apiVersion: v1
kind: Service
metadata:
  annotations:
    networking.gke.io/internal-load-balancer-allow-global-access: "true"
    networking.gke.io/load-balancer-type: Internal
  labels:
    app: flwr-superlink
    app.kubernetes.io/component: aggregator
    app.kubernetes.io/part-of: fed-lora-poc
  name: flwr-superlink-service
  namespace: fed-lora-aggregator
spec:
  loadBalancerIP: 10.200.0.50
  loadBalancerSourceRanges:
    - YOUR_STORE_CIDR
  ports:
    - name: fleet-api
      port: 9092
      protocol: TCP
      targetPort: 9092
    - name: exec-api
      port: 9093
      protocol: TCP
      targetPort: 9093
  selector:
    app: flwr-superlink
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: flwr-superlink
    app.kubernetes.io/part-of: fed-lora-poc
  name: flwr-server-service
  namespace: fed-lora-aggregator
spec:
  ports:
    - name: fleet-api
      port: 9092
      protocol: TCP
      targetPort: 9092
    - name: exec-api
      port: 9093
      protocol: TCP
      targetPort: 9093
  selector:
    app: flwr-superlink
