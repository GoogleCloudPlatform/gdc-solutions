# Declarative Config Sync Stackdriver Add-On Configuration for GDC Software-Only Edge Clusters
# Enables Google Cloud Managed Service for Prometheus (GMP) PodMonitoring CRDs
# (spec.enableGMPForApplications: true) and application container log forwarding
# (spec.enableCloudLoggingForApplications: true) across fed-lora-poc and gpu-operator.
#
# Reference Documentation:
# - https://cloud.google.com/distributed-cloud/connected/docs/configure-logging-monitoring
# - https://cloud.google.com/kubernetes-engine/distributed-cloud/bare-metal/docs/concepts/Logical-architecture-logging-monitoring

apiVersion: addons.gke.io/v1alpha1
kind: Stackdriver
metadata:
  annotations:
    client.lifecycle.config.k8s.io/deletion: detach
  name: stackdriver
  namespace: kube-system
spec:
  clusterLocation: us-central1
  clusterName: YOUR_STORE_1_CLUSTER
  enableCloudLoggingForApplications: true
  enableGMPForApplications: true
  enableMultiline: true
  fleetWorkloadIdentitySecretName: google-cloud-credentials
  gcpServiceAccountSecretName: google-cloud-credentials
  namespaceProfile: baremetal
  projectID: YOUR_PROJECT_ID
  proxyConfigSecretName: bm-stackdriver-proxy-config
  resourceAttrOverride:
    collector/prometheus:
      limits:
        cpu: 1000m
        memory: 3072Mi
      requests:
        cpu: 30m
        memory: 65Mi
    gmp-operator/operator:
      limits:
        cpu: 100m
        memory: 200Mi
      requests:
        cpu: 30m
        memory: 15Mi
    rule-evaluator/evaluator:
      limits:
        cpu: 1000m
        memory: 1024Mi
      requests:
        cpu: 30m
        memory: 65Mi
  scaling: auto
  stackdriverComponentLogVerbosityLevel: info
