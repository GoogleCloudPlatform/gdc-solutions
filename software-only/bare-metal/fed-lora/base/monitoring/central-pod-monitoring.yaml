# Google Cloud Managed Service for Prometheus (GMP) PodMonitoring CRD
# for Flower SuperLink Central Aggregator (namespace: fed-lora-aggregator) on GKE.
# Scrapes global federated convergence & canary consensus metrics (:9100/metrics).

apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  labels:
    app.kubernetes.io/component: central-aggregator-monitoring
    app.kubernetes.io/part-of: fed-lora-poc
  name: flwr-superlink-monitoring
  namespace: fed-lora-aggregator
spec:
  endpoints:
    - interval: 15s
      path: /metrics
      port: metrics
  selector:
    matchLabels:
      app: flwr-superlink
