# FleetPackage specification for GDC software-only store edge clusters (app-tier=fed-lora-edge).
# Google Cloud Config Delivery does not substitute YOUR_* placeholders at rollout time:
# either substitute YOUR_* in a private GitOps repository copy, run ./fleet-package/render.sh,
# and push an immutable release tag (v1.0.0), or publish a substituted ResourceBundle release
# and switch resourceBundleSelector to resourceBundle.
# Create with:
#   gcloud container fleet packages create fed-lora-edge-package \
#     --source=fleet-package/fleetpackage-edge.yaml --location=us-central1

deletionPropagationPolicy: FOREGROUND
resourceBundleSelector:
  cloudBuildRepository:
    name: projects/YOUR_PROJECT_ID/locations/us-central1/connections/YOUR_CONNECTION/repositories/YOUR_REPOSITORY
    path: software-only/bare-metal/fed-lora/fleet-package/environments
    serviceAccount: projects/YOUR_PROJECT_ID/serviceAccounts/YOUR_PUBLISHER_SA_NAME@YOUR_PROJECT_ID.iam.gserviceaccount.com
    tag: v1.0.0
rolloutStrategy:
  rolling:
    maxConcurrent: 2
target:
  fleet:
    project: projects/YOUR_PROJECT_ID
    selector:
      matchLabels:
        app-tier: fed-lora-edge
variantSelector:
  variantNameTemplate: ${membership.labels['store']}
