    # OpenMetrics (:9100/metrics) Exporter & GDC fluent-bit Structured Cloud Logging
    # for GDC Software-Only Edge Pods (flwr-trainer) and GKE Aggregator (flwr-superlink).
    #
    # Architectural Invariants (v2.1.13 Google Cloud Observability):
    # 1. Pure Python stdlib ONLY (zero PyTorch/CUDA imports) to preserve <25ms CPU-only
    #    ClientApp.evaluate() lazy initialization (Public Safe Version).
    # 2. Shared in-container /tmp state (/tmp/fed_lora_metrics.json) protected by
    #    fcntl.flock + atomic os.replace("/tmp/fed_lora_metrics.prom.tmp",
    #    "/tmp/fed_lora_metrics.prom") so ephemeral SubprocessExecutor workers
    #    update metrics while PID 1's background HTTP server serves :9100/metrics 24/7.
    # 3. Normalized labels: always `cluster_name` ("YOUR_STORE_1_CLUSTER", "YOUR_STORE_2_CLUSTER",
    #    "YOUR_AGGREGATOR_CLUSTER") and `store_id` ("store-1", "store-2", "global").
    # 4. Strict `scope` enum:
    #    - fed_lora_lora_b_frobenius_norm: "local_store" vs "global_merged"
    #    - fed_lora_canary_pass_ratio / faithfulness / promotions / current_round:
    #      "store-1", "store-2", or "fleet-consensus"
    # 5. ZERO `round` label on continuous time-series gauges (prevents Monarch/GMP
    #    cross-round averaging distortion and broken line segments).
    # 6. GDC fluent-bit single-line JSON log output (`separators=(",", ":")`) to
    #    sys.__stdout__ with lowercase "severity", "message", and string-only
    #    "logging.googleapis.com/labels".

    from __future__ import annotations

    import argparse
    import fcntl
    import json
    import os
    import socket
    import subprocess
    import sys
    import threading
    import time
    import urllib.error
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from typing import Any, Dict, Optional, Tuple

    DEFAULT_STATE_FILE = os.environ.get(
        "FED_LORA_METRICS_JSON", "/tmp/fed_lora_metrics.json"
    )
    DEFAULT_PROM_FILE = os.environ.get(
        "FED_LORA_METRICS_PROM", "/tmp/fed_lora_metrics.prom"
    )

    VALID_NORM_SCOPES = frozenset({"local_store", "global_merged"})
    VALID_FLEET_SCOPES = frozenset({"store-1", "store-2", "fleet-consensus"})
    CANARY_CATEGORIES = ("overall", "C1", "C2", "C3", "C4", "C5", "C6")


    def resolve_identity(
        store_id: Optional[str] = None,
        cluster_name: Optional[str] = None,
    ) -> Tuple[str, str, str]:
        """Normalizes (store_id, cluster_name, default_fleet_scope)."""
        raw_store = store_id if store_id is not None else os.environ.get("STORE_ID", "")
        raw_store_str = str(raw_store).strip().lower()
        if raw_store_str in ("1", "store-1", "store1"):
            norm_store = "store-1"
            default_cluster = "YOUR_STORE_1_CLUSTER"
            default_scope = "store-1"
        elif raw_store_str in ("2", "store-2", "store2"):
            norm_store = "store-2"
            default_cluster = "YOUR_STORE_2_CLUSTER"
            default_scope = "store-2"
        else:
            norm_store = "global"
            default_cluster = "YOUR_AGGREGATOR_CLUSTER"
            default_scope = "fleet-consensus"

        raw_cluster = (
            cluster_name if cluster_name is not None else os.environ.get("CLUSTER_NAME", "")
        )
        norm_cluster = str(raw_cluster).strip() if raw_cluster else default_cluster
        if not norm_cluster:
            norm_cluster = default_cluster
        return norm_store, norm_cluster, default_scope


    def _default_state(
        store_id: str, cluster_name: str, fleet_scope: str
    ) -> Dict[str, Any]:
        """Returns a clean Stage-1 Baseline zeroed metric state dictionary."""
        is_server = store_id == "global"
        norm_scopes = ["global_merged"] if is_server else ["local_store", "global_merged"]
        canary_cats = {cat: 0.0 for cat in CANARY_CATEGORIES}
        return {
            "store_id": store_id,
            "cluster_name": cluster_name,
            "fleet_scope": fleet_scope,
            "updated_at": time.time(),
            "current_round": 0,
            "worker_active": {
                "fit": 0,
                "evaluate": 0,
                "aggregate": 0,
            },
            "round_loss": {
                "kl_prox_total": 0.0,
                "sft_ce": 0.0,
            },
            "lora_b_frobenius_norm": {sc: 0.0 for sc in norm_scopes},
            "canary_pass_ratio": canary_cats,
            "canary_faithfulness_score": 0.0,
            "canary_promotions_total": {
                "PROMOTE": 0,
                "REJECT": 0,
            },
            "phase_duration_seconds": {
                "vllm_sleep": 0.0,
                "model_load": 0.0,
                "qlora_fit": 0.0,
                "subspace_merge": 0.0,
                "canary_eval": 0.0,
                "vllm_wake": 0.0,
            },
            "payload_bytes": {
                "uplink_fit": 0,
                "downlink_eval": 0,
                "fab_bundle": 0,
            },
            "gpu_vram_used_mib": {"0": 0.0},
            "vllm_is_sleeping": 0,
            "vllm_up": 0 if is_server else 1,
            "supernode_up": 0 if is_server else 1,
        }


    def render_openmetrics(state: Dict[str, Any]) -> str:
        """Renders the state dict into strict Prometheus / OpenMetrics text format."""
        store_id = str(state.get("store_id", "global"))
        cluster_name = str(state.get("cluster_name", "YOUR_AGGREGATOR_CLUSTER"))
        fleet_scope = str(state.get("fleet_scope", "fleet-consensus"))
        if fleet_scope not in VALID_FLEET_SCOPES:
            fleet_scope = "fleet-consensus" if store_id == "global" else store_id

        lines = []

        # 1. fed_lora_gpu_vram_used_mib
        lines.append(
            "# HELP fed_lora_gpu_vram_used_mib Physical GPU VRAM used in MiB from"
            " nvidia-smi."
        )
        lines.append("# TYPE fed_lora_gpu_vram_used_mib gauge")
        gpu_map = state.get("gpu_vram_used_mib") or {"0": 0.0}
        for gpu_idx, vram_val in sorted(gpu_map.items()):
            lines.append(
                f'fed_lora_gpu_vram_used_mib{{store_id="{store_id}",cluster_name="{cluster_name}",gpu_index="{gpu_idx}"}}'
                f" {float(vram_val):.2f}"
            )

        # 2. fed_lora_vllm_is_sleeping
        lines.append(
            "# HELP fed_lora_vllm_is_sleeping 1 when local vllm-gemma4 is in Level-1"
            " sleep mode, 0 when awake."
        )
        lines.append("# TYPE fed_lora_vllm_is_sleeping gauge")
        lines.append(
            f'fed_lora_vllm_is_sleeping{{store_id="{store_id}",cluster_name="{cluster_name}"}}'
            f' {int(state.get("vllm_is_sleeping", 0))}'
        )

        # 3. fed_lora_supernode_up & fed_lora_vllm_up
        lines.append(
            "# HELP fed_lora_supernode_up 1 when flwr-supernode-service:9094"
            " (ClientAppIo) is reachable, 0 otherwise."
        )
        lines.append("# TYPE fed_lora_supernode_up gauge")
        lines.append(
            f'fed_lora_supernode_up{{store_id="{store_id}",cluster_name="{cluster_name}"}}'
            f' {int(state.get("supernode_up", 0))}'
        )
        lines.append(
            "# HELP fed_lora_vllm_up 1 when vllm-service:8000 HTTP endpoint is"
            " reachable, 0 otherwise."
        )
        lines.append("# TYPE fed_lora_vllm_up gauge")
        lines.append(
            f'fed_lora_vllm_up{{store_id="{store_id}",cluster_name="{cluster_name}"}}'
            f' {int(state.get("vllm_up", 0))}'
        )

        # 4. fed_lora_current_round
        lines.append(
            "# HELP fed_lora_current_round Current Federated Learning round (0 at"
            " Stage 1 Baseline reset, 1..3 during active federation)."
        )
        lines.append("# TYPE fed_lora_current_round gauge")
        lines.append(
            f'fed_lora_current_round{{scope="{fleet_scope}",store_id="{store_id}",cluster_name="{cluster_name}"}}'
            f' {int(state.get("current_round", 0))}'
        )

        # 5. fed_lora_worker_active
        lines.append(
            "# HELP fed_lora_worker_active 1 while ephemeral flwr-clientapp or"
            " flwr-serverapp subprocess is active, 0 when idle."
        )
        lines.append("# TYPE fed_lora_worker_active gauge")
        worker_map = state.get("worker_active") or {}
        for phase in ("fit", "evaluate", "aggregate"):
            val = int(worker_map.get(phase, 0))
            lines.append(
                f'fed_lora_worker_active{{store_id="{store_id}",cluster_name="{cluster_name}",phase="{phase}"}}'
                f" {val}"
            )

        # 6. fed_lora_round_loss (NO round label — continuous time series!)
        lines.append(
            "# HELP fed_lora_round_loss Continuous training loss per store/aggregator"
            " across rounds (reset to 0.0 at Stage 1)."
        )
        lines.append("# TYPE fed_lora_round_loss gauge")
        loss_map = state.get("round_loss") or {}
        for loss_type in ("kl_prox_total", "sft_ce"):
            val = float(loss_map.get(loss_type, 0.0))
            lines.append(
                f'fed_lora_round_loss{{store_id="{store_id}",cluster_name="{cluster_name}",loss_type="{loss_type}"}}'
                f" {val:.6f}"
            )

        # 7. fed_lora_lora_b_frobenius_norm (strict scope in {"local_store", "global_merged"}, NO round label!)
        lines.append(
            "# HELP fed_lora_lora_b_frobenius_norm Frobenius norm ||lora_B||_F"
            " (scope=local_store or global_merged)."
        )
        lines.append("# TYPE fed_lora_lora_b_frobenius_norm gauge")
        norm_map = state.get("lora_b_frobenius_norm") or {}
        for sc, val in sorted(norm_map.items()):
            if sc in VALID_NORM_SCOPES:
                lines.append(
                    f'fed_lora_lora_b_frobenius_norm{{scope="{sc}",store_id="{store_id}",cluster_name="{cluster_name}"}}'
                    f" {float(val):.6f}"
                )

        # 8. fed_lora_canary_pass_ratio (strict scope in {"store-1", "store-2", "fleet-consensus"}, NO round label!)
        lines.append(
            "# HELP fed_lora_canary_pass_ratio Continuous Canary evaluation pass"
            " ratio (0.0 to 1.0)."
        )
        lines.append("# TYPE fed_lora_canary_pass_ratio gauge")
        canary_map = state.get("canary_pass_ratio") or {}
        for cat in CANARY_CATEGORIES:
            if cat in canary_map:
                lines.append(
                    f'fed_lora_canary_pass_ratio{{scope="{fleet_scope}",store_id="{store_id}",cluster_name="{cluster_name}",category="{cat}"}}'
                    f" {float(canary_map[cat]):.4f}"
                )

        # 9. fed_lora_canary_faithfulness_score
        lines.append(
            "# HELP fed_lora_canary_faithfulness_score Mean local Gemma 4 base-model"
            " judge faithfulness score (0.0 to 5.0)."
        )
        lines.append("# TYPE fed_lora_canary_faithfulness_score gauge")
        lines.append(
            f'fed_lora_canary_faithfulness_score{{scope="{fleet_scope}",store_id="{store_id}",cluster_name="{cluster_name}"}}'
            f' {float(state.get("canary_faithfulness_score", 0.0)):.4f}'
        )

        # 10. fed_lora_canary_promotions_total
        lines.append(
            "# HELP fed_lora_canary_promotions_total Cumulative count of Two-Phase"
            " Canary Quarantine verdicts (PROMOTE vs REJECT)."
        )
        lines.append("# TYPE fed_lora_canary_promotions_total counter")
        promo_map = state.get("canary_promotions_total") or {}
        for verdict in ("PROMOTE", "REJECT"):
            lines.append(
                f'fed_lora_canary_promotions_total{{scope="{fleet_scope}",store_id="{store_id}",cluster_name="{cluster_name}",verdict="{verdict}"}}'
                f" {int(promo_map.get(verdict, 0))}"
            )

        # 11. fed_lora_phase_duration_seconds
        lines.append(
            "# HELP fed_lora_phase_duration_seconds Wall-clock duration in seconds of"
            " each federated sub-phase."
        )
        lines.append("# TYPE fed_lora_phase_duration_seconds gauge")
        dur_map = state.get("phase_duration_seconds") or {}
        for phase, val in sorted(dur_map.items()):
            lines.append(
                f'fed_lora_phase_duration_seconds{{store_id="{store_id}",cluster_name="{cluster_name}",phase="{phase}"}}'
                f" {float(val):.4f}"
            )

        # 12. fed_lora_payload_bytes
        lines.append(
            "# HELP fed_lora_payload_bytes Bytes transmitted across federated"
            " uplink_fit, downlink_eval, or fab_bundle."
        )
        lines.append("# TYPE fed_lora_payload_bytes gauge")
        bytes_map = state.get("payload_bytes") or {}
        for direction, val in sorted(bytes_map.items()):
            lines.append(
                f'fed_lora_payload_bytes{{store_id="{store_id}",cluster_name="{cluster_name}",direction="{direction}"}}'
                f" {int(val)}"
            )

        return "\n".join(lines) + "\n"


    def update_metrics_state(
        updates: Dict[str, Any],
        store_id: Optional[str] = None,
        cluster_name: Optional[str] = None,
        state_file: str = DEFAULT_STATE_FILE,
        prom_file: str = DEFAULT_PROM_FILE,
        reset: bool = False,
    ) -> Dict[str, Any]:
        """Atomically updates /tmp/fed_lora_metrics.json and replaces /tmp/fed_lora_metrics.prom."""
        norm_store, norm_cluster, fleet_scope = resolve_identity(store_id, cluster_name)
        state_dir = os.path.dirname(os.path.abspath(state_file))
        prom_dir = os.path.dirname(os.path.abspath(prom_file))
        if state_dir:
            os.makedirs(state_dir, exist_ok=True)
        if prom_dir:
            os.makedirs(prom_dir, exist_ok=True)

        lock_path = f"{state_file}.lock"
        with open(lock_path, "a+", encoding="utf-8") as lock_fp:
            fcntl.flock(lock_fp.fileno(), fcntl.LOCK_EX)
            try:
                state = _default_state(norm_store, norm_cluster, fleet_scope)
                if not reset and os.path.exists(state_file):
                    try:
                        with open(state_file, "r", encoding="utf-8") as rf:
                            loaded = json.load(rf)
                        if isinstance(loaded, dict):
                            for k, v in loaded.items():
                                if isinstance(v, dict) and isinstance(state.get(k), dict):
                                    state[k].update(v)
                                else:
                                    state[k] = v
                    except Exception:
                        pass

                state["store_id"] = norm_store
                state["cluster_name"] = norm_cluster
                state["fleet_scope"] = updates.get("fleet_scope", fleet_scope)
                state["updated_at"] = time.time()

                for k, v in updates.items():
                    if k == "fleet_scope":
                        continue
                    if isinstance(v, dict) and isinstance(state.get(k), dict):
                        state[k].update(v)
                    else:
                        state[k] = v

                tmp_json = f"{state_file}.tmp.{os.getpid()}"
                with open(tmp_json, "w", encoding="utf-8") as wf:
                    json.dump(state, wf, indent=2, sort_keys=True)
                os.replace(tmp_json, state_file)

                prom_text = render_openmetrics(state)
                tmp_prom = f"{prom_file}.tmp.{os.getpid()}"
                with open(tmp_prom, "w", encoding="utf-8") as pf:
                    pf.write(prom_text)
                os.replace(tmp_prom, prom_file)
                return state
            finally:
                fcntl.flock(lock_fp.fileno(), fcntl.LOCK_UN)


    def emit_cloud_log(
        event_type: str,
        message: str,
        severity: str = "INFO",
        component: str = "flwr-trainer",
        server_round: int = 0,
        store_id: Optional[str] = None,
        cluster_name: Optional[str] = None,
        scope: Optional[str] = None,
        metrics: Optional[Dict[str, Any]] = None,
        extra_labels: Optional[Dict[str, Any]] = None,
        stream: Any = None,
    ) -> str:
        """Emits a single-line GDC fluent-bit-compliant JSON log entry to sys.__stdout__."""
        norm_store, norm_cluster, default_scope = resolve_identity(store_id, cluster_name)
        resolved_scope = scope if scope else default_scope
        sev_upper = str(severity).strip().upper()
        if sev_upper not in ("INFO", "WARNING", "ERROR", "DEBUG", "CRITICAL"):
            sev_upper = "INFO"

        labels: Dict[str, str] = {
            "cluster_name": str(norm_cluster),
            "store_id": str(norm_store),
            "component": str(component),
            "event_type": str(event_type),
            "server_round": str(int(server_round)),
            "scope": str(resolved_scope),
        }
        if extra_labels:
            for lk, lv in extra_labels.items():
                labels[str(lk)] = str(lv)

        payload: Dict[str, Any] = {
            "severity": sev_upper,
            "message": str(message),
            "component": str(component),
            "event_type": str(event_type),
            "server_round": int(server_round),
            "store_id": str(norm_store),
            "cluster_name": str(norm_cluster),
            "scope": str(resolved_scope),
            "logging.googleapis.com/labels": labels,
            "metrics": metrics if isinstance(metrics, dict) else {},
            "timestamp": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
        }
        line = json.dumps(payload, separators=(",", ":"), sort_keys=True) + "\n"
        target_stream = (
            stream if stream is not None else getattr(sys, "__stdout__", sys.stdout)
        )
        if target_stream is not None:
            try:
                target_stream.write(line)
                target_stream.flush()
            except Exception:
                pass
        return line


    def reset_stage1_metrics(
        store_id: Optional[str] = None,
        cluster_name: Optional[str] = None,
        state_file: str = DEFAULT_STATE_FILE,
        prom_file: str = DEFAULT_PROM_FILE,
        stream: Any = None,
    ) -> Dict[str, Any]:
        """Resets all OpenMetrics gauges/counters to Stage 1 Baseline zeroes and logs STAGE1_BASELINE_RESET."""
        norm_store, norm_cluster, fleet_scope = resolve_identity(store_id, cluster_name)
        component = "flwr-superlink" if norm_store == "global" else "flwr-trainer"
        state = update_metrics_state(
            updates={},
            store_id=norm_store,
            cluster_name=norm_cluster,
            state_file=state_file,
            prom_file=prom_file,
            reset=True,
        )
        emit_cloud_log(
            event_type="STAGE1_BASELINE_RESET",
            message=(
                f"[Stage 1 Baseline Reset] Zeroed OpenMetrics gauges in {prom_file} "
                f"for store_id={norm_store} cluster_name={norm_cluster}"
            ),
            severity="INFO",
            component=component,
            server_round=0,
            store_id=norm_store,
            cluster_name=norm_cluster,
            scope=fleet_scope,
            metrics={
                "fed_lora_current_round": 0,
                "fed_lora_round_loss": 0.0,
                "fed_lora_lora_b_frobenius_norm": 0.0,
                "fed_lora_canary_pass_ratio": 0.0,
                "fed_lora_worker_active": 0,
            },
            stream=stream,
        )
        return state


    def probe_edge_runtime(
        vllm_url: Optional[str] = None,
        supernode_addr: str = "flwr-supernode-service:9094",
    ) -> Dict[str, Any]:
        """Probes local GPU VRAM (nvidia-smi), vLLM /is_sleeping, and flwr-supernode TCP liveness."""
        result: Dict[str, Any] = {}

        # 1. Probe nvidia-smi
        try:
            out = subprocess.check_output(
                [
                    "nvidia-smi",
                    "--query-gpu=index,memory.used",
                    "--format=csv,noheader,nounits",
                ],
                timeout=2.0,
                stderr=subprocess.DEVNULL,
            ).decode("utf-8", errors="ignore")
            gpu_map: Dict[str, float] = {}
            for line in out.strip().splitlines():
                parts = [p.strip() for p in line.split(",")]
                if len(parts) >= 2:
                    gpu_map[parts[0]] = float(parts[1])
            if gpu_map:
                result["gpu_vram_used_mib"] = gpu_map
        except Exception:
            pass

        # 2. Probe vLLM /is_sleeping
        resolved_vllm = (
            vllm_url
            if vllm_url is not None
            else os.environ.get(
                "VLLM_SERVER_URL",
                "http://vllm-service.fed-lora-poc.svc.cluster.local:8000",
            )
        ).rstrip("/")
        if resolved_vllm:
            try:
                req = urllib.request.Request(f"{resolved_vllm}/is_sleeping", method="GET")
                with urllib.request.urlopen(req, timeout=1.5) as resp:
                    body = json.loads(resp.read().decode("utf-8", errors="ignore"))
                    result["vllm_up"] = 1
                    result["vllm_is_sleeping"] = 1 if body.get("is_sleeping") else 0
            except Exception:
                result["vllm_up"] = 0

        # 3. Probe flwr-supernode ClientAppIo TCP port
        try:
            host, port_str = supernode_addr.split(":", 1)
            with socket.create_connection((host, int(port_str)), timeout=1.5):
                result["supernode_up"] = 1
        except Exception:
            result["supernode_up"] = 0

        return result


    def run_metrics_http_server(
        port: int = 9100,
        state_file: str = DEFAULT_STATE_FILE,
        prom_file: str = DEFAULT_PROM_FILE,
        probe_interval: float = 5.0,
    ) -> None:
        """Starts a persistent background OpenMetrics HTTP server on :9100/metrics."""
        norm_store, norm_cluster, _ = resolve_identity()
        if not os.path.exists(prom_file):
            update_metrics_state(
                updates={},
                store_id=norm_store,
                cluster_name=norm_cluster,
                state_file=state_file,
                prom_file=prom_file,
                reset=True,
            )

        def _background_prober() -> None:
            while True:
                try:
                    if norm_store in ("store-1", "store-2"):
                        live_probes = probe_edge_runtime()
                        if live_probes:
                            update_metrics_state(
                                updates=live_probes,
                                store_id=norm_store,
                                cluster_name=norm_cluster,
                                state_file=state_file,
                                prom_file=prom_file,
                                reset=False,
                            )
                except Exception:
                    pass
                time.sleep(probe_interval)

        prober_thread = threading.Thread(target=_background_prober, daemon=True)
        prober_thread.start()

        class MetricsHandler(BaseHTTPRequestHandler):

            def do_GET(self) -> None:  # pylint: disable=invalid-name
                if self.path.startswith("/metrics") or self.path.startswith("/healthz"):
                    try:
                        if os.path.exists(prom_file):
                            with open(prom_file, "rb") as f:
                                data = f.read()
                        else:
                            data = render_openmetrics(
                                _default_state(*resolve_identity())
                            ).encode("utf-8")
                        self.send_response(200)
                        self.send_header(
                            "Content-Type", "text/plain; version=0.0.4; charset=utf-8"
                        )
                        self.send_header("Content-Length", str(len(data)))
                        self.end_headers()
                        self.wfile.write(data)
                    except Exception as exc:
                        err_bytes = f"error reading metrics: {exc}\n".encode("utf-8")
                        self.send_response(500)
                        self.send_header("Content-Type", "text/plain; charset=utf-8")
                        self.send_header("Content-Length", str(len(err_bytes)))
                        self.end_headers()
                        self.wfile.write(err_bytes)
                else:
                    self.send_response(404)
                    self.end_headers()

            def log_message(self, format_str: str, *args: Any) -> None:
                return

        server = ThreadingHTTPServer(("0.0.0.0", port), MetricsHandler)
        emit_cloud_log(
            event_type="METRICS_EXPORTER_STARTED",
            message=(
                f"OpenMetrics HTTP exporter listening on 0.0.0.0:{port}/metrics"
                f" (store_id={norm_store}, cluster_name={norm_cluster},"
                f" file={prom_file})"
            ),
            severity="INFO",
            component="flwr-superlink" if norm_store == "global" else "flwr-trainer",
            server_round=0,
            store_id=norm_store,
            cluster_name=norm_cluster,
        )
        server.serve_forever()


    def main() -> None:
        parser = argparse.ArgumentParser(
            description=("Fed-LoRA OpenMetrics (:9100/metrics) Exporter & Reset Utility")
        )
        parser.add_argument(
            "--reset",
            action="store_true",
            help="Reset /tmp/fed_lora_metrics.prom to Stage 1 Baseline zeroes",
        )
        parser.add_argument(
            "--serve",
            action="store_true",
            help="Run persistent HTTP OpenMetrics exporter on --port (default 9100)",
        )
        parser.add_argument("--port", type=int, default=9100)
        parser.add_argument("--file", type=str, default=DEFAULT_PROM_FILE)
        parser.add_argument("--state-file", type=str, default=DEFAULT_STATE_FILE)
        parser.add_argument("--store-id", type=str, default=None)
        parser.add_argument("--cluster-name", type=str, default=None)
        args = parser.parse_args()

        if args.reset:
            reset_stage1_metrics(
                store_id=args.store_id,
                cluster_name=args.cluster_name,
                state_file=args.state_file,
                prom_file=args.file,
            )
        if args.serve:
            run_metrics_http_server(
                port=args.port,
                state_file=args.state_file,
                prom_file=args.file,
            )


    if __name__ == "__main__":
        main()
kind: ConfigMap
metadata:
  name: fed-lora-observability
  namespace: fed-lora-aggregator
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: flwr-superlink
    app.kubernetes.io/part-of: fed-lora-poc
  name: flwr-server-service
  namespace: fed-lora-aggregator
spec:
  ports:
    - name: fleet-api
      port: 9092
      protocol: TCP
      targetPort: 9092
    - name: exec-api
      port: 9093
      protocol: TCP
      targetPort: 9093
  selector:
    app: flwr-superlink
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    networking.gke.io/internal-load-balancer-allow-global-access: "true"
    networking.gke.io/load-balancer-type: Internal
  labels:
    app: flwr-superlink
    app.kubernetes.io/component: aggregator
    app.kubernetes.io/part-of: fed-lora-poc
  name: flwr-superlink-service
  namespace: fed-lora-aggregator
spec:
  loadBalancerIP: 10.200.0.50
  loadBalancerSourceRanges:
    - YOUR_STORE_CIDR
  ports:
    - name: fleet-api
      port: 9092
      protocol: TCP
      targetPort: 9092
    - name: exec-api
      port: 9093
      protocol: TCP
      targetPort: 9093
  selector:
    app: flwr-superlink
  type: LoadBalancer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: flwr-superlink
    app.kubernetes.io/component: aggregator
    app.kubernetes.io/part-of: fed-lora-poc
  name: flwr-superlink
  namespace: fed-lora-aggregator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flwr-superlink
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: flwr-superlink
        app.kubernetes.io/component: aggregator
        app.kubernetes.io/part-of: fed-lora-poc
    spec:
      containers:
        - command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /root/.flwr /tmp/checkpoints /tmp/pylib/fed_lora
              cp /etc/fed-lora-observability/observability.py /tmp/pylib/observability.py
              cp /etc/fed-lora-observability/observability.py /tmp/pylib/fed_lora/observability.py
              printf 'from observability import *\n' > /tmp/pylib/fed_lora/__init__.py
              python3 -m fed_lora.observability --serve --port 9100 --file /tmp/fed_lora_metrics.prom &
              cat << 'EOF' > /root/.flwr/config.toml
              [superlink]
              default = "gke-superlink"

              [superlink.gke-superlink]
              address = "127.0.0.1:9093"
              insecure = true
              EOF
              echo "[INFO] Starting pre-baked Flower SuperLink daemon (FleetAPI :9092, ControlAPI :9093, OpenMetrics :9100)..."
              exec flower-superlink --insecure --fleet-api-address 0.0.0.0:9092 --control-api-address 0.0.0.0:9093 --disable-runtime-dependency-installation
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONPATH
              value: /tmp/pylib
            - name: STORE_ID
              value: global
            - name: CLUSTER_NAME
              value: YOUR_AGGREGATOR_CLUSTER
            - name: GCS_CHECKPOINT_PREFIX
              value: gs://YOUR_GCS_BUCKET/checkpoints
          image: us-central1-docker.pkg.dev/YOUR_PROJECT_ID/YOUR_AR_REPO/flwr-superlink:v2.1.6
          imagePullPolicy: IfNotPresent
          livenessProbe:
            periodSeconds: 10
            tcpSocket:
              port: 9092
          name: flwr-superlink
          ports:
            - containerPort: 9092
              name: fleet-api
              protocol: TCP
            - containerPort: 9093
              name: exec-api
              protocol: TCP
            - containerPort: 9100
              name: metrics
              protocol: TCP
          readinessProbe:
            periodSeconds: 5
            tcpSocket:
              port: 9092
          resources:
            limits:
              cpu: "2"
              memory: 4Gi
            requests:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            failureThreshold: 20
            initialDelaySeconds: 2
            periodSeconds: 3
            tcpSocket:
              port: 9092
          volumeMounts:
            - mountPath: /etc/fed-lora-observability
              name: fed-lora-observability
              readOnly: true
      volumes:
        - configMap:
            name: fed-lora-observability
          name: fed-lora-observability
---
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  labels:
    app.kubernetes.io/component: central-aggregator-monitoring
    app.kubernetes.io/part-of: fed-lora-poc
  name: flwr-superlink-monitoring
  namespace: fed-lora-aggregator
spec:
  endpoints:
    - interval: 15s
      path: /metrics
      port: metrics
  selector:
    matchLabels:
      app: flwr-superlink
