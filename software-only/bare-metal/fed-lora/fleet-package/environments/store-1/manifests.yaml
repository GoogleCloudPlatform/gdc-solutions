apiVersion: v1
data:
  refresh_ar_pull_secret.py: |
    import base64
    import json
    import os
    import ssl
    import urllib.error
    import urllib.request

    project_id = os.environ.get("GCP_PROJECT_ID", "YOUR_PROJECT_ID")
    membership = os.environ["FLEET_MEMBERSHIP_NAME"]
    registry_host = os.environ.get("AR_REGISTRY_HOST", "us-central1-docker.pkg.dev")

    with open("/var/run/secrets/tokens/gcp-ksa/token", "r", encoding="utf-8") as f:
      ksa_jwt = f.read().strip()

    audience = (
        f"identitynamespace:{project_id}.svc.id.goog:"
        f"https://gkehub.googleapis.com/projects/{project_id}/locations/global/memberships/{membership}"
    )
    sts_payload = json.dumps({
        "audience": audience,
        "grantType": "urn:ietf:params:oauth:grant-type:token-exchange",
        "requestedTokenType": "urn:ietf:params:oauth:token-type:access_token",
        "scope": "https://www.googleapis.com/auth/cloud-platform",
        "subjectTokenType": "urn:ietf:params:oauth:token-type:jwt",
        "subjectToken": ksa_jwt,
    }).encode("utf-8")
    sts_req = urllib.request.Request(
        "https://sts.googleapis.com/v1/token",
        data=sts_payload,
        headers={"Content-Type": "application/json"},
    )
    with urllib.request.urlopen(sts_req, timeout=15) as resp:
      access_token = json.loads(resp.read().decode("utf-8"))["access_token"]

    auth_b64 = base64.b64encode(f"oauth2accesstoken:{access_token}".encode("utf-8")).decode("utf-8")
    cred_entry = {
        "username": "oauth2accesstoken",
        "password": access_token,
        "auth": auth_b64,
    }
    docker_cfg = json.dumps({
        "auths": {
            registry_host: cred_entry,
            "gcr.io": cred_entry,
            "https://gcr.io": cred_entry,
        }
    }).encode("utf-8")
    docker_cfg_b64 = base64.b64encode(docker_cfg).decode("utf-8")

    with open("/var/run/secrets/kubernetes.io/serviceaccount/token", "r", encoding="utf-8") as f:
      k8s_tok = f.read().strip()
    ctx = ssl.create_default_context(cafile="/var/run/secrets/kubernetes.io/serviceaccount/ca.crt")
    headers = {
        "Authorization": f"Bearer {k8s_tok}",
        "Content-Type": "application/json",
    }

    for ns in ("fed-lora-poc", "gmp-system"):
      secret_url = f"https://kubernetes.default.svc/api/v1/namespaces/{ns}/secrets/ar-pull-secret"
      patch_body = json.dumps({
          "apiVersion": "v1",
          "kind": "Secret",
          "metadata": {"name": "ar-pull-secret", "namespace": ns},
          "type": "kubernetes.io/dockerconfigjson",
          "data": {".dockerconfigjson": docker_cfg_b64},
      }).encode("utf-8")
      try:
        k8s_req = urllib.request.Request(secret_url, data=patch_body, method="PUT", headers=headers)
        with urllib.request.urlopen(k8s_req, context=ctx, timeout=15) as k8s_resp:
          print(f"Refreshed {ns}/ar-pull-secret status: {k8s_resp.status} (membership={membership})")
      except urllib.error.HTTPError as e:
        if e.code == 404:
          try:
            create_req = urllib.request.Request(
                f"https://kubernetes.default.svc/api/v1/namespaces/{ns}/secrets",
                data=patch_body,
                method="POST",
                headers=headers,
            )
            with urllib.request.urlopen(create_req, context=ctx, timeout=15) as c_resp:
              print(f"Created {ns}/ar-pull-secret status: {c_resp.status} (membership={membership})")
          except urllib.error.HTTPError:
            pass
        elif ns == "fed-lora-poc":
          raise

      if ns == "gmp-system":
        sa_patch = json.dumps({"imagePullSecrets": [{"name": "ar-pull-secret"}]}).encode("utf-8")
        sa_headers = dict(headers)
        sa_headers["Content-Type"] = "application/strategic-merge-patch+json"
        for sa_name in ("default", "operator", "collector", "rule-evaluator"):
          sa_url = f"https://kubernetes.default.svc/api/v1/namespaces/gmp-system/serviceaccounts/{sa_name}"
          try:
            sa_req = urllib.request.Request(sa_url, data=sa_patch, method="PATCH", headers=sa_headers)
            urllib.request.urlopen(sa_req, context=ctx, timeout=10).close()
          except Exception:
            pass
