apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: flwr-trainer
    app.kubernetes.io/name: flwr-trainer
    app.kubernetes.io/part-of: fed-lora-poc
    component: edge-trainer
    fed-lora.gdcso.google.com/store: store-1
  name: flwr-trainer
  namespace: fed-lora-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flwr-trainer
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: flwr-trainer
        app.kubernetes.io/name: flwr-trainer
        app.kubernetes.io/part-of: fed-lora-poc
        component: edge-trainer
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: vllm-serving
              topologyKey: kubernetes.io/hostname
      containers:
        - command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /tmp/pylib/fed_lora
              cp /etc/fed-lora-observability/observability.py /tmp/pylib/observability.py
              cp /etc/fed-lora-observability/observability.py /tmp/pylib/fed_lora/observability.py
              printf 'from observability import *\n' > /tmp/pylib/fed_lora/__init__.py
              python3 -m fed_lora.observability --serve --port 9100 --file /tmp/fed_lora_metrics.prom &
              exec flower-superexec --insecure --runtime-api-address flwr-supernode-service:9094 --plugin-type clientapp
          env:
            - name: PYTORCH_CUDA_ALLOC_CONF
              value: expandable_segments:True
            - name: STORE_ID
              value: "1"
            - name: PYTHONPATH
              value: /tmp/pylib
            - name: CLUSTER_NAME
              value: YOUR_STORE_1_CLUSTER
            - name: SUPERLINK_ADDRESS
              value: 10.200.0.50:9092
            - name: VLLM_SERVER_URL
              value: http://vllm-service.fed-lora-poc.svc.cluster.local:8000
            - name: BASE_MODEL_NAME
              value: google/gemma-4-E2B-it
            - name: HF_HOME
              value: /mnt/models/huggingface
            - name: HOME
              value: /home/flwr
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /etc/workload-identity/fleet-wi-config.json
            - name: GOOGLE_CLOUD_PROJECT
              value: YOUR_PROJECT_ID
            - name: GCLOUD_PROJECT
              value: YOUR_PROJECT_ID
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: hf-token-secret
                  optional: true
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: hf-token-secret
                  optional: true
          image: us-central1-docker.pkg.dev/YOUR_PROJECT_ID/YOUR_AR_REPO/flwr-trainer:v2.1.6
          imagePullPolicy: IfNotPresent
          name: flwr-trainer
          ports:
            - containerPort: 9100
              name: metrics
              protocol: TCP
          resources:
            limits:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: "2"
              memory: 12Gi
              nvidia.com/gpu: "1"
          securityContext:
            runAsGroup: 2000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /mnt/models
              name: shared-models
            - mountPath: /mnt/store-data
              name: store-training-data
              readOnly: true
            - mountPath: /dev/shm
              name: dshm
            - mountPath: /var/run/secrets/tokens/gcp-ksa
              name: gcp-ksa
              readOnly: true
            - mountPath: /etc/workload-identity
              name: fleet-wi-config
              readOnly: true
            - mountPath: /etc/fed-lora-observability
              name: fed-lora-observability
              readOnly: true
      imagePullSecrets:
        - name: ar-pull-secret
      initContainers:
        - command:
            - bash
            - -c
            - |
              set -e
              mkdir -p /mnt/models/adapters \
                       /mnt/models/huggingface \
                       /mnt/models/edge-data/store-1 \
                       /mnt/models/edge-data/store-2 \
                       /mnt/models/store1-local-adapter \
                       /mnt/models/store2-local-adapter \
                       /mnt/models/store-fed-lora-round-1 \
                       /mnt/models/store-fed-lora-candidate
              chmod -R 2775 /mnt/models/adapters \
                            /mnt/models/edge-data \
                            /mnt/models/store1-local-adapter \
                            /mnt/models/store2-local-adapter \
                            /mnt/models/store-fed-lora-round-1 \
                            /mnt/models/store-fed-lora-candidate
              chown -R 1000:2000 /mnt/models/adapters \
                                 /mnt/models/edge-data \
                                 /mnt/models/store1-local-adapter \
                                 /mnt/models/store2-local-adapter \
                                 /mnt/models/store-fed-lora-round-1 \
                                 /mnt/models/store-fed-lora-candidate
              chgrp -R 2000 /mnt/models/huggingface 2>/dev/null || true
              chmod -R g+rwX /mnt/models/huggingface 2>/dev/null || true
          image: us-docker.pkg.dev/vertex-ai/vertex-vision-model-garden-dockers/pytorch-vllm-serve:gemma4
          imagePullPolicy: IfNotPresent
          name: init-adapters-permissions
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
          volumeMounts:
            - mountPath: /mnt/models
              name: shared-models
        - command:
            - sh
            - -c
            - |
              set -e
              SRC="/mnt/store-data/train.jsonl"
              DST_DIR="/mnt/models/edge-data/store-${STORE_ID}"
              DST="${DST_DIR}/train.jsonl"
              mkdir -p "${DST_DIR}"
              SRC_SHA=$(sha256sum "${SRC}" | awk '{print $1}')
              DST_SHA="missing"
              if [ -f "${DST}" ]; then
                DST_SHA=$(sha256sum "${DST}" | awk '{print $1}')
              fi
              echo "[seed-store-training-data] store=${STORE_ID} src=${SRC} (sha256=${SRC_SHA}) dst=${DST} (before_sha256=${DST_SHA})"
              if [ ! -f "${DST}" ] || [ "${SRC_SHA}" != "${DST_SHA}" ]; then
                cp "${SRC}" "${DST}"
                DST_SHA=$(sha256sum "${DST}" | awk '{print $1}')
                echo "[seed-store-training-data] Copied ${SRC} -> ${DST} (after_sha256=${DST_SHA})"
              else
                echo "[seed-store-training-data] ${DST} already up-to-date (sha256=${DST_SHA})"
              fi
          env:
            - name: STORE_ID
              value: "1"
          image: us-central1-docker.pkg.dev/YOUR_PROJECT_ID/YOUR_AR_REPO/flwr-trainer:v2.1.6
          imagePullPolicy: IfNotPresent
          name: seed-store-training-data
          securityContext:
            runAsGroup: 2000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /mnt/models
              name: shared-models
            - mountPath: /mnt/store-data
              name: store-training-data
              readOnly: true
      runtimeClassName: nvidia
      securityContext:
        fsGroup: 2000
      serviceAccountName: default
      volumes:
        - name: shared-models
          persistentVolumeClaim:
            claimName: shared-model-pvc
        - configMap:
            name: store-training-data
          name: store-training-data
        - emptyDir:
            medium: Memory
            sizeLimit: 8Gi
          name: dshm
        - name: gcp-ksa
          projected:
            defaultMode: 420
            sources:
              - serviceAccountToken:
                  audience: YOUR_PROJECT_ID.svc.id.goog
                  expirationSeconds: 3600
                  path: token
        - configMap:
            name: fleet-wi-credentials-config
          name: fleet-wi-config
        - configMap:
            name: fed-lora-observability
          name: fed-lora-observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vllm-serving
    fed-lora.gdcso.google.com/store: store-1
    model: gemma-4-E2B-it
  name: vllm-gemma4
  namespace: fed-lora-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-serving
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: vllm-serving
        model: gemma-4-E2B-it
    spec:
      containers:
        - args:
            - --model
            - google/gemma-4-E2B-it
            - --enable-lora
            - --enable-sleep-mode
            - --max-lora-rank
            - "16"
            - --gpu-memory-utilization
            - "0.85"
            - --port
            - "8000"
          command:
            - bash
            - -c
            - |
              set -e
              mkdir -p /mnt/models/adapters /mnt/models/huggingface
              chmod -R 2775 /mnt/models/adapters 2>/dev/null || true
              chown -R 1000:2000 /mnt/models/adapters 2>/dev/null || true
              python3 -c "
              p = '/usr/local/lib/python3.12/dist-packages/vllm/model_executor/models/gemma4_mm.py'
              txt = open(p).read()
              txt = txt.replace('from .interfaces import MultiModalEmbeddings, SupportsMultiModal, SupportsPP', 'from .interfaces import MultiModalEmbeddings, SupportsMultiModal, SupportsPP, SupportsLoRA')
              txt = txt.replace('class Gemma4ForConditionalGeneration(nn.Module, SupportsMultiModal, SupportsPP):', 'class Gemma4ForConditionalGeneration(nn.Module, SupportsMultiModal, SupportsPP, SupportsLoRA):')
              if 'Gemma4ForConditionalGeneration.supports_lora = True' not in txt:
                  txt += '\nGemma4ForConditionalGeneration.supports_lora = True\nGemma4ForConditionalGeneration.packed_modules_mapping = {\"qkv_proj\": [\"q_proj\", \"k_proj\", \"v_proj\"], \"gate_up_proj\": [\"gate_proj\", \"up_proj\"]}\nGemma4ForConditionalGeneration.embedding_modules = {}\nGemma4ForConditionalGeneration.embedding_padding_modules = []\n'
              open(p, 'w').write(txt)
              verify_txt = open(p).read()
              assert 'SupportsLoRA' in verify_txt and 'Gemma4ForConditionalGeneration.supports_lora = True' in verify_txt, 'SupportsLoRA patch failed!'
              print('[PASS] Gemma4ForConditionalGeneration SupportsLoRA: True')
              "
              exec python3 -m vllm.entrypoints.openai.api_server "$@"
            - --
          env:
            - name: VLLM_ALLOW_RUNTIME_LORA_UPDATING
              value: "True"
            - name: VLLM_SERVER_DEV_MODE
              value: "1"
            - name: HF_HOME
              value: /mnt/models/huggingface
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: hf-token-secret
                  optional: true
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: hf-token-secret
                  optional: true
          image: us-docker.pkg.dev/vertex-ai/vertex-vision-model-garden-dockers/pytorch-vllm-serve:gemma4
          imagePullPolicy: IfNotPresent
          name: vllm-openai
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          resources:
            limits:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "1"
            requests:
              cpu: "4"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - mountPath: /mnt/models
              name: shared-models
            - mountPath: /dev/shm
              name: dshm
      runtimeClassName: nvidia
      securityContext:
        fsGroup: 2000
      volumes:
        - name: shared-models
          persistentVolumeClaim:
            claimName: shared-model-pvc
        - emptyDir:
            medium: Memory
            sizeLimit: 16Gi
          name: dshm
---
apiVersion: batch/v1
kind: CronJob
metadata:
  labels:
    app: ar-pull-refresher
    app.kubernetes.io/part-of: fed-lora-poc
    fed-lora.gdcso.google.com/store: store-1
  name: ar-pull-refresher
  namespace: fed-lora-poc
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - command:
                - python3
                - /etc/ar-pull-refresher/refresh_ar_pull_secret.py
              env:
                - name: FLEET_MEMBERSHIP_NAME
                  value: YOUR_STORE_1_CLUSTER
                - name: GCP_PROJECT_ID
                  value: YOUR_PROJECT_ID
                - name: AR_REGISTRY_HOST
                  value: us-central1-docker.pkg.dev
              image: docker.io/library/python:3.12-slim
              imagePullPolicy: IfNotPresent
              name: refresher
              volumeMounts:
                - mountPath: /var/run/secrets/tokens/gcp-ksa
                  name: gcp-ksa
                  readOnly: true
                - mountPath: /etc/ar-pull-refresher
                  name: refresher-script
                  readOnly: true
          restartPolicy: OnFailure
          serviceAccountName: ar-pull-refresher
          volumes:
            - name: gcp-ksa
              projected:
                defaultMode: 420
                sources:
                  - serviceAccountToken:
                      audience: YOUR_PROJECT_ID.svc.id.goog
                      expirationSeconds: 3600
                      path: token
            - configMap:
                name: ar-pull-refresher-script
              name: refresher-script
  schedule: "*/30 * * * *"
  successfulJobsHistoryLimit: 1
