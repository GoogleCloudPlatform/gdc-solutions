# Run configuration for Stage 4 Federated Aggregation (Single-Round gamma=0.56 Subspace Merge + Tiered Canary Gate)
mode = "federated"
num-server-rounds = 1
local-epochs = 4
learning-rate = 0.0002
weight-decay = 0.01
lora-r = 16
lora-alpha = 64
lora-dropout = 0.1
kl-coef = 0.2
kl-alpha = 0.5
kl-temperature = 2.0
proximal-mu = 0.1
target-loss = 0.35
aggregation-mode = "subspace_resid"
residual-gamma = 0.85
round2-gamma = 0.56
pre-merge-gain-small = 1.40
pre-merge-gain-large = 1.30
energy-balance-target-norm = 15.5
trim-quantile = 0.2
ties-density = 0.8
scaling-lambda = 1.0
clipping-norm = 20.0
canary-gate = true
use-pretrained-local = true
